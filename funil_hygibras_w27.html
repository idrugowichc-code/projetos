* { box-sizing: border-box; }
body {

.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.header .sub { font-size: 12px; color: var(--text-dim); }
.badge-partial {
  display: inline-block; margin-left: 12px;
  background: rgba(249,115,22,0.18); color: #FB923C;
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  vertical-align: middle;
}
.btn-export {
  background: var(--c-leads); color: white; border: none;
  padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.btn-export:hover { background: #2563EB; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-strong); margin-bottom: 24px; flex-wrap: wrap; }
.tab {

  padding: 12px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -1px;

.tab:hover { color: var(--text); }
.tab.active { color: var(--c-leads); border-bottom-color: var(--c-leads); }
.panel { display: none; }
.panel.active { display: block; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.card-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 14px; }

.ytd { background: linear-gradient(135deg, #111827 0%, #1F2937 100%); border: 1px solid #374151; border-radius: 12px; padding: 22px 26px; margin-bottom: 22px; display: grid; grid-template-columns: 200px 1fr; gap: 28px; align-items: center; }
.ytd-label { border-right: 1px solid #374151; padding-right: 24px; }

.ytd-label .per { font-size: 15px; color: var(--text); margin-top: 6px; font-weight: 600; }
.ytd-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.ytd-metric .ml { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.ytd-metric .mv { font-size: 22px; font-weight: 700; }

.kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }

.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 600; }
.kpi .val { font-size: 26px; font-weight: 700; color: var(--clr, var(--c-leads)); margin-top: 4px; }
.kpi .sub { font-size: 11px; color: var(--text-mute); margin-top: 4px; }
.delta { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.delta.up { background: rgba(16,185,129,0.15); color: #34D399; }
.delta.dn { background: rgba(239,68,68,0.15); color: #F87171; }

.funil-label { font-size: 12px; font-weight: 600; color: var(--text); }

.funil-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 12px; font-size: 12px; font-weight: 700; color: white; min-width: 5%; transition: width 0.3s; }
.funil-pct { font-size: 13px; text-align: right; font-weight: 700; color: var(--text); }

.insights { display: flex; flex-direction: column; gap: 8px; }
.insight { background: var(--bg-elev); border-left: 3px solid var(--clr, var(--c-leads)); padding: 10px 14px; border-radius: 4px; font-size: 12px; color: var(--text); }
.insight strong { color: var(--clr, var(--c-leads)); }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { color: #E5E7EB; background: #0F1521; border-bottom: 2px solid #374151; padding: 10px 8px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
td { padding: 9px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:hover td { background: rgba(55,65,81,0.25); }
tr.partial td { color: #D1D5DB; font-style: italic; }
tr.total-row td { background: #0F1521; border-top: 2px solid #374151; font-weight: 700; color: #F9FAFB; padding: 12px 8px; border-bottom: none; }
tr.best td { background: linear-gradient(90deg, rgba(16,185,129,0.10) 0%, transparent 100%); font-weight: 600; }
.star { color: var(--c-receita); margin-right: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.pills { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.pill { background: var(--bg-elev); border: 1px solid var(--border-strong); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-dim); transition: all 0.15s; }
.pill:hover { color: var(--text); border-color: var(--c-leads); }
.pill.active { background: var(--c-leads); color: white; border-color: var(--c-leads); }

.chart-wrap { position: relative; height: 280px; }
.chart-wrap.tall { height: 320px; }
.chart-legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; flex-wrap: wrap; }
.chart-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

.visita-card { background: var(--bg-elev); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--c-visitas); gap: 12px; }

Chart.defaults.color = '#9CA3AF';
Chart.defaults.borderColor = '#1F293780';
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
Chart.defaults.font.size = 11;

const fmt = {
  n: (v) => (v == null || !isFinite(v)) ? '—' : Math.round(v).toLocaleString('pt-BR'),
  m: (v) => (v == null || !isFinite(v)) ? 'R$ —' : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}),
  pct: (v) => (v == null || !isFinite(v)) ? '—' : (v*100).toFixed(1).replace('.',',') + '%',
  delta: (cur, prev) => {
    if (prev == null || prev === 0 || !isFinite(prev)) return {val:null, dir:'eq'};
    const d = (cur - prev) / prev;
    if (!isFinite(d)) return {val:null, dir:'eq'};
    return { val: d, dir: d > 0.005 ? 'up' : d < -0.005 ? 'dn' : 'eq' };
  }
};

const dBadge = d => {
  if (d.val === null || !isFinite(d.val)) return '';
  if (d.dir === 'eq') return '';
  const pct = Math.abs(d.val * 100);
  const s = pct.toFixed(1).replace('.', ',');
  const sign = d.val > 0 ? '↑' : '↓';
  return `<div class="delta ${d.dir}">${sign} ${s}%</div>`;
};

const charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function calcYTD() {
  const y = { leads:0, qualif:0, orc:0, visitas:0, vendas:0, receita:0 };
  MONTHS.forEach(m => {
    y.leads += m.totals.leads || 0; y.qualif += m.totals.qualif || 0;
    y.orc += m.totals.orcamentos || 0; y.visitas += m.visitas_total || 0;
    y.vendas += m.totals.vendas || 0; y.receita += m.totals.receita || 0;
  });
  return y;
}

function renderFunilConsolidado(y) {
  const stages = [
    { label: 'Leads', value: y.leads, color: C.leads },
    { label: 'Qualificados', value: y.qualif, color: C.qualif },
    { label: 'Orçamentos', value: y.orc, color: C.orc },
    { label: 'Visitas', value: y.visitas, color: C.visitas },
    { label: 'Vendas', value: y.vendas, color: C.vendas },
  ];
  const maxVal = stages[0].value || 1;
  let html = '';
  stages.forEach((s, i) => {
    const w = Math.max(5, (s.value/maxVal)*100);
    const isLast = i === stages.length-1;
    let pctHtml = '';
    if (isLast) {
      const lv = y.vendas / y.leads;
      const qv = y.vendas / y.qualif;
      pctHtml = `<div class="funil-pct funil-pct-stack">
        <div class="funil-pct-line" style="color:${C.conv_lv}">${fmt.pct(lv)} <span style="color:#9CA3AF; font-weight:500">L→V</span></div>
        <div class="funil-pct-line" style="color:${C.conv_qv}">${fmt.pct(qv)} <span style="color:#9CA3AF; font-weight:500">Q→V</span></div>
      </div>`;
    } else if (i > 0) {
      const ratio = s.value / stages[0].value;
      pctHtml = `<div class="funil-pct">${fmt.pct(ratio)}</div>`;
    } else {
      pctHtml = `<div class="funil-pct" style="color:${C.leads}">100,0%</div>`;
    }
    html += `<div class="funil-row">
      <div class="funil-label">${s.label}</div>
      <div class="funil-bar"><div class="funil-fill" style="background:${s.color}; width:${w}%">${fmt.n(s.value)}</div></div>
      ${pctHtml}
    </div>`;
  });
  document.getElementById('funil-cons').innerHTML = html;
}

function renderInsights(last, prev, ytd) {
  const items = [];
  const qualRate = (last.totals.qualif || 0) / (last.totals.leads || 1);
  const convLV = (last.totals.vendas || 0) / (last.totals.leads || 1);
  const convQV = (last.totals.vendas || 0) / (last.totals.qualif || 1);
  const ticket = (last.totals.receita || 0) / (last.totals.vendas || 1);
  const prevTicket = (prev.totals.receita || 0) / (prev.totals.vendas || 1);

  if (last.partial) items.push({c:C.visitas, txt:`<strong>● ${last.name} em andamento</strong> — dados parciais`});
  if (qualRate > 0.1) items.push({c:C.qualif, txt:`<strong>✓ Qualificação saudável</strong> — ${fmt.pct(qualRate)} de qualificados sobre leads`});
  else if (qualRate < 0.05 && last.totals.leads > 0) items.push({c:C.alert, txt:`<strong>⚠ Qualificação baixa</strong> — apenas ${fmt.pct(qualRate)}, revisar critério`});
  if (convLV < 0.02 && last.totals.leads > 0) items.push({c:C.alert, txt:`<strong>⚠ Conv L→V baixa</strong> — ${fmt.pct(convLV)}, gargalo no funil`});
  if (convQV > 0.25) items.push({c:C.vendas, txt:`<strong>✓ Time comercial fechando bem</strong> — ${fmt.pct(convQV)} dos qualificados viram venda`});
  else if (convQV > 0 && convQV < 0.1) items.push({c:C.alert, txt:`<strong>⚠ Conv Q→V baixa</strong> — ${fmt.pct(convQV)}, revisar abordagem comercial`});
  if (prev.totals.receita > 0 && last.totals.receita > prev.totals.receita * 1.3) items.push({c:C.vendas, txt:`<strong>↑ Crescimento expressivo</strong> em receita vs. mês anterior`});
  if (prev.totals.receita > 0 && last.totals.receita < prev.totals.receita * 0.5 && !last.partial) items.push({c:C.alert, txt:`<strong>↓ Queda na receita</strong> que requer investigação`});

  if (last.visitas_total > 0 && last.totals.qualif > 0) items.push({c:C.visitas, txt:`<strong>○ ${fmt.pct(last.visitas_total/last.totals.qualif)}</strong> dos qualificados foram visitados em ${last.name}`});

function sparkSvg(values, color, w=80, h=22) {
  if (!values.length) return '';
  const max = Math.max(...values, 1);
  const step = w / Math.max(1, values.length-1);
  const pts = values.map((v, i) => `${(i*step).toFixed(1)},${(h - (v/max)*h).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

function renderRanking() {
  const map = {};
  const norm = (n) => {
    const u = (n||'').toUpperCase();
    if (u.includes('JEFERSON')) return 'Jeferson Tozzo';
    if (u.includes('RAFAEL')) return 'Rafael de Jesus';
    if (u.includes('FERNANDA')) return 'Fernanda Roque';
    if (u.includes('FERNANDO')) return 'Fernando';
    if (u.includes('VIVIANE')) return 'Viviane Donizete';
    if (u.includes('RODRIGO')) return 'Rodrigo Castelo';
    return (n||'').trim() || '—';
  };
  MONTHS.forEach(m => (m.vendas_fechadas||[]).forEach(v => {
    const k = norm(v.vendedor);
    if (!map[k]) map[k] = { vendas: 0, receita: 0 };
    map[k].vendas += 1; map[k].receita += v.valor || 0;
  }));
  const arr = Object.entries(map).map(([n,v]) => ({nome:n, ...v})).sort((a,b) => b.receita - a.receita);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('ranking-vend').innerHTML = arr.length === 0
    ? '<div style="color:var(--text-dim); padding:10px 0">Sem dados de vendedores.</div>'
    : arr.map((v,i) => `<div class="rank-row">
        <div style="display:flex; align-items:center;"><span class="rank-medal">${medals[i] || '·'}</span><span class="rank-name">${v.nome}</span></div>
        <div style="text-align:right"><div class="rank-val">${fmt.m(v.receita)}</div><div style="font-size:11px; color:var(--text-dim)">${fmt.n(v.vendas)} ${v.vendas===1?'venda':'vendas'}</div></div>
      </div>`).join('');
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
    const tab = t.dataset.tab;
    if (tab === 'semanal') renderSemanal();
    if (tab === 'origens') renderOrigens();
    if (tab === 'visitas') renderVisitas();
    if (tab === 'vendas') renderVendas();
  });
});

renderPanorama();
</script>
</body>
