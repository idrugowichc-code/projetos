  brl: v => (v==null||!isFinite(v))?'R$ —':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
  brlShort: v => {
    if(v==null||!isFinite(v))return 'R$ —';
    if(v>=1000)return 'R$ '+(v/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k';

  },
  pct: v => (v==null||!isFinite(v))?'—':(v*100).toFixed(1).replace('.',',')+'%',
};

function delta(cur, prev){
  if(prev===null||prev===undefined||prev===0||!isFinite(prev)) return {val:null, dir:'eq'};
  const d = (cur-prev)/prev;
  if(!isFinite(d)) return {val:null, dir:'eq'};
  return {val:d, dir: d>0.005?'up': d<-0.005?'dn':'eq'};
}
function dBadge(d){
  if(d.val===null||!isFinite(d.val)) return '';
  if(d.dir==='eq') return '';
  const pct = Math.abs(d.val*100);
  const s = pct.toFixed(1).replace('.',',');
  const sign = d.val>0?'↑':'↓';
  return `<div class="delta ${d.dir}">${sign} ${s}%</div>`;
}

// ---------- ORIGENS ----------
let currentOrigemMonth = null;
function renderOrigens(){
  const monthList = DATA.months;
  currentOrigemMonth = currentOrigemMonth || 'YTD';
  const options = ['YTD', ...monthList.map(m=>m.label)];
  const pills = options.map(o=>`<button class="pill ${o===currentOrigemMonth?'active':''}" data-m="${o}">${o}</button>`).join('');

  // Origens data
  let origens = {Email:0, Krolic:0, 'RD Station':0, Outbound:0};
  if(currentOrigemMonth==='YTD'){
    monthList.forEach(m=>{
      Object.keys(origens).forEach(k=>{ origens[k] += m.totals.origens[k]||0 });
    });
  } else {
    const m = monthList.find(x=>x.label===currentOrigemMonth);
    origens = {...m.totals.origens};
  }
  const totalOrig = Object.values(origens).reduce((a,b)=>a+b,0);

  // Sellers ranking from sales (all months)
  const sellerMap = {};
  monthList.forEach(m=>{
    if(currentOrigemMonth!=='YTD' && m.label!==currentOrigemMonth) return;
    m.sales.forEach(s=>{
      if(!s.vendedor) return;
      if(!sellerMap[s.vendedor]) sellerMap[s.vendedor] = {vendas:0, receita:0};
      sellerMap[s.vendedor].vendas += 1;
      sellerMap[s.vendedor].receita += s.valor;
    });
  });
  const sellerRank = Object.entries(sellerMap).sort((a,b)=>b[1].receita-a[1].receita);
  const medals = ['🥇','🥈','🥉'];

  const html = `
    <div class="pills">${pills}</div>
    <div class="grid-2eq">
      <div class="card">
        <h3>Origens de leads ${currentOrigemMonth==='YTD'?'— YTD':'— '+currentOrigemMonth}</h3>
        <div class="chart-wrap"><canvas id="chart-orig-bar"></canvas></div>
      </div>
      <div class="card">
        <h3>Participação por canal</h3>
        <div class="chart-wrap"><canvas id="chart-orig-donut"></canvas></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Ranking vendedores ${currentOrigemMonth==='YTD'?'— YTD':'— '+currentOrigemMonth} <span class="sub">por receita fechada</span></h3>
      ${sellerRank.length===0 ? '<div style="color:var(--text-dim); padding:12px 0">Sem vendas registradas neste período.</div>' :
        sellerRank.map(([name,s],i)=>`<div class="rank-row">
          <div class="rank-name">${i<3?`<span class="medal">${medals[i]}</span>`:'<span class="medal" style="opacity:.4">·</span>'}${name}</div>
          <div class="rank-val"><strong>${fmt.brl(s.receita)}</strong> · ${s.vendas} venda${s.vendas!==1?'s':''}</div>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('tab-origens').innerHTML = html;

  const labels = Object.keys(origens);
  const values = Object.values(origens);
  new Chart(document.getElementById('chart-orig-bar'), {
    type:'bar',
    data:{ labels, datasets:[{ data:values, backgroundColor:CAT.slice(0,labels.length), borderRadius:6, borderSkipped:false }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>fmt.n(c.parsed.x)+' leads'}} },
      scales:{
        y:{ grid:{display:false} },
        x:{ grid:{color:'#1F2937'}, ticks:{callback:v=>fmt.n(v)} }
      }
    }
  });
  new Chart(document.getElementById('chart-orig-donut'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:CAT.slice(0,labels.length), borderColor:'#0A0E1A', borderWidth:2 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>c.label+': '+fmt.n(c.parsed)+' ('+fmt.pct(c.parsed/totalOrig)+')'}} }
    }
  });
  const canvas = document.getElementById('chart-orig-donut');
  const legend = document.createElement('div');
  legend.className='legend';
  legend.innerHTML = labels.map((l,i)=>`<span class="item"><span class="dot" style="background:${CAT[i]}"></span>${l} · ${fmt.pct(values[i]/totalOrig)}</span>`).join('');
  canvas.parentElement.parentElement.insertBefore(legend, canvas.parentElement);

  document.querySelectorAll('#tab-origens .pill').forEach(p=>{
    p.addEventListener('click',()=>{ currentOrigemMonth = p.dataset.m; renderOrigens(); });
  });
}

let currentVisitasMonth = null;
function renderVisitas(){
  const monthList = DATA.months;
  currentVisitasMonth = currentVisitasMonth || 'YTD';
  const options = ['YTD', ...monthList.map(m=>m.label)];
  const pills = options.map(o=>`<button class="pill ${o===currentVisitasMonth?'active':''}" data-m="${o}">${o}</button>`).join('');

  let visits = [];
  let totalVis = 0, qualif = 0, vendas = 0;
  if(currentVisitasMonth==='YTD'){
    monthList.forEach(m=>{
      m.visits.items.forEach(v=>visits.push({...v, mes:m.label}));
      totalVis += m.visits.total;
      qualif += m.totals.qualif;
      vendas += m.totals.vendas;
    });
  } else {
    const m = monthList.find(x=>x.label===currentVisitasMonth);
    visits = m.visits.items.map(v=>({...v, mes:m.label}));
    totalVis = m.visits.total;
    qualif = m.totals.qualif;
    vendas = m.totals.vendas;
  }
  const pctQualif = qualif>0 ? totalVis/qualif : 0;
  const convVV = totalVis>0 ? vendas/totalVis : 0;

  const cards = visits.map(v=>{
    const s = (v.status||'').toLowerCase();
    let cls = 'other';
    if(s.includes('ok')) cls='ok';
    else if(s.includes('pend')) cls='pendente';
    const statusLabel = v.status || 'ok';
    return `<div class="visit-card">
      <div><strong>${v.cliente}</strong>${currentVisitasMonth==='YTD'?` <span style="color:var(--text-mute); font-size:11px">· ${v.mes}</span>`:''}</div>
      <span class="status ${cls}">${statusLabel}</span>
    </div>`;
  }).join('') || '<div style="color:var(--text-dim); padding:12px 0">Sem visitas neste período.</div>';

  const html = `
    <div class="pills">${pills}</div>
    <div class="kpi3">
      <div class="kpi" style="border-left-color:${C.visitas}">
        <div class="label">Total de Visitas</div>
        <div class="value" style="color:${C.visitas}">${fmt.n(totalVis)}</div>
        <div class="sub">${currentVisitasMonth==='YTD'?'YTD 2026':currentVisitasMonth+' 2026'}</div>
      </div>
      <div class="kpi" style="border-left-color:${C.qualif}">
        <div class="label">% dos Qualificados</div>
        <div class="value" style="color:${C.qualif}">${fmt.pct(pctQualif)}</div>
        <div class="sub">${fmt.n(totalVis)} de ${fmt.n(qualif)} qualificados</div>
      </div>
      <div class="kpi" style="border-left-color:${C.vendas}">
        <div class="label">Conv Visita → Venda</div>
        <div class="value" style="color:${C.vendas}">${fmt.pct(convVV)}</div>
        <div class="sub">estimado (${fmt.n(vendas)} vendas / ${fmt.n(totalVis)} visitas)</div>
      </div>
    </div>
    <div class="card">
      <h3>Lista de visitas ${currentVisitasMonth==='YTD'?'— YTD':'— '+currentVisitasMonth}</h3>
      ${cards}
    </div>
  `;

  document.querySelectorAll('#tab-visitas .pill').forEach(p=>{
    p.addEventListener('click',()=>{ currentVisitasMonth = p.dataset.m; renderVisitas(); });
  });
}

let currentVendasMonth = null;
function renderVendas(){
  const monthList = DATA.months;
  currentVendasMonth = currentVendasMonth || 'YTD';
  const options = ['YTD', ...monthList.map(m=>m.label)];
  const pills = options.map(o=>`<button class="pill ${o===currentVendasMonth?'active':''}" data-m="${o}">${o}</button>`).join('');
