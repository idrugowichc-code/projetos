<style>
:root {
  --c-leads:#3B82F6;--c-qualif:#8B5CF6;--c-visitas:#F97316;--c-orc:#06B6D4;
  --c-vendas:#10B981;--c-receita:#F59E0B;--c-ticket:#EC4899;
  --c-conv-lv:#10B981;--c-conv-qv:#14B8A6;--c-alert:#EF4444;--c-success:#22C55E;
  --bg:#0A0E1A;--bg-card:#111827;--bg-elev:#1F2937;--bg-hover:#374151;
  --border:#1F2937;--border-strong:#374151;
  --text:#F9FAFB;--text-dim:#9CA3AF;--text-mute:#6B7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
  min-height: 100vh;
}
.container { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }
header { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.title h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.title .sub { color: var(--text-dim); font-size: 13px; }
.badge-partial { background: rgba(249,115,22,0.15); color: var(--c-visitas); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid rgba(249,115,22,0.3); }
.export-btn { background: var(--c-leads); color:#fff; border:0; padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:0.15s; }
.export-btn:hover { background:#2563EB; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x:auto; }
.tab { padding: 12px 18px; color: var(--text-dim); background: transparent; border: 0; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.15s; white-space:nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--c-leads); }
.panel { display: none; }
.panel.active { display: block; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g5 { grid-template-columns: repeat(5, 1fr); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .g2,.g3,.g4,.g5,.g-2-1 { grid-template-columns: 1fr; } }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.card h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }

.ytd-card { background: linear-gradient(135deg, #111827 0%, #1F2937 100%); border: 1px solid var(--border-strong); border-radius: 14px; padding: 24px; margin-bottom: 24px; display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; }
.ytd-label { border-right: 1px solid var(--border-strong); padding-right: 24px; }
.ytd-label .k { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.ytd-label .v { font-size: 17px; font-weight: 700; color: var(--text); }
.ytd-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.ytd-metric .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-mute); margin-bottom: 6px; }
.ytd-metric .val { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.ytd-metric .val.leads { color: var(--c-leads); }
.ytd-metric .val.qualif { color: var(--c-qualif); }
.ytd-metric .val.visitas { color: var(--c-visitas); }
.ytd-metric .val.vendas { color: var(--c-vendas); }
.ytd-metric .val.receita { color: var(--c-receita); }
@media (max-width: 900px) { .ytd-card { grid-template-columns: 1fr; } .ytd-label{border-right:0;border-bottom:1px solid var(--border-strong);padding-right:0;padding-bottom:16px;} .ytd-metrics{grid-template-columns:repeat(2,1fr);} }

.kpi { position: relative; padding-left: 16px; }
.kpi::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--kc, var(--c-leads)); }
.kpi .lbl { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:6px; }
.kpi .val { font-size:26px; font-weight:700; color:var(--kc); letter-spacing:-0.02em; line-height:1.1; }
.kpi .sub { font-size:11px; color:var(--text-mute); margin-top:4px; }
.delta { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; padding:2px 6px; border-radius:6px; margin-top:6px; }
.delta.up { color: var(--c-success); background: rgba(34,197,94,0.12); }
.delta.dn { color: var(--c-alert); background: rgba(239,68,68,0.12); }

.funnel { display:flex; flex-direction:column; gap:8px; }
.step { display:grid; grid-template-columns: 120px 1fr 120px; align-items:center; gap:12px; }
.step-label { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }
.step-bar { height:36px; background: var(--sc); border-radius: 8px; display:flex; align-items:center; justify-content:flex-end; padding:0 12px; font-weight:600; color:#fff; font-size:13px; min-width: 5%; }
.step-pct { font-size:11px; color:var(--text-dim); text-align:right; display:flex; flex-direction:column; gap:2px; }
.step-pct .p1 { color: var(--c-conv-lv); font-weight:600; }
.step-pct .p2 { color: var(--c-conv-qv); font-weight:600; }

.insights { display:flex; flex-direction:column; gap:8px; }
.insight { background: var(--bg-elev); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--text); position:relative; padding-left:16px; }
.insight::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background: var(--ic, var(--c-leads)); }

table { width:100%; border-collapse: collapse; font-size:12px; }
th { color: #E5E7EB; background: #0F1521; text-align:left; padding: 10px 8px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; font-size:11px; border-bottom: 2px solid var(--border-strong); }
td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
tr:hover td { background: rgba(31,41,55,0.5); }
tr.partial td { color: #D1D5DB; font-style: italic; }
tr.total-row td { background: #0F1521; border-top: 2px solid var(--border-strong); font-weight:700; color: var(--text); padding: 12px 8px; }
tr.best-row td { background: linear-gradient(90deg, rgba(16,185,129,0.09) 0%, transparent 100%); font-weight:600; }
.star { color: var(--c-receita); margin-right: 4px; }
.num { text-align:right; font-variant-numeric: tabular-nums; }
.pill { display:inline-block; padding:2px 8px; border-radius: 999px; font-size:10px; font-weight:600; }
.pill-ok { background: rgba(16,185,129,0.15); color: var(--c-vendas); }
.pill-pending { background: rgba(249,115,22,0.15); color: var(--c-visitas); }

.month-pills { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.month-pill { padding: 6px 14px; border-radius: 999px; background: var(--bg-elev); color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: 0.15s; }
.month-pill:hover { color: var(--text); }
.month-pill.active { background: var(--c-leads); color:#fff; border-color: var(--c-leads); }

.legend { display:flex; gap:16px; align-items:center; margin-bottom:8px; font-size: 11px; flex-wrap:wrap; }
.legend-item { display:flex; gap:6px; align-items:center; color: var(--text-dim); }
.legend-dot { width:10px; height:10px; border-radius:50%; }

canvas { max-width: 100%; }
.chart-wrap { position:relative; height: 260px; }
.chart-wrap.tall { height: 320px; }

.sparkline { height:24px; width:80px; display:inline-block; vertical-align:middle; }

.visit-card { background: var(--bg-elev); border-radius:8px; padding: 12px 14px; display:flex; justify-content:space-between; align-items:center; }
.visit-card .name { font-size:12px; color: var(--text); font-weight:500; flex:1; }

.mb-24 { margin-bottom: 24px; }
.mb-16 { margin-bottom: 16px; }
h4.section-h { font-size: 13px; color: var(--text); font-weight:600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }

.medal { display:inline-block; width:22px; height:22px; border-radius:50%; text-align:center; font-size:11px; font-weight:700; line-height:22px; margin-right:8px; color:#0A0E1A; }
.medal-1 { background: #FCD34D; }
.medal-2 { background: #D1D5DB; }
.medal-3 { background: #FB923C; }
</style>
</head>

  convLV:'#10B981', convQV:'#14B8A6', alert:'#EF4444', success:'#22C55E',
  cat: ['#3B82F6','#F59E0B','#10B981','#8B5CF6','#EC4899','#06B6D4','#F97316']

Chart.defaults.color = '#9CA3AF';
Chart.defaults.borderColor = '#1F293780';
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
Chart.defaults.font.size = 11;

const fmtBR = (n, dec=0) => (n||0).toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
const fmtRS = (n) => 'R$ ' + fmtBR(n, 2);
const fmtRSk = (n) => n >= 1000 ? 'R$ ' + fmtBR(n/1000, 1) + 'k' : 'R$ ' + fmtBR(n, 0);
const fmtPct = (n) => (n*100).toFixed(1).replace('.', ',') + '%';

const delta = (cur, prev) => {
  if (prev === null || prev === undefined || prev === 0 || !isFinite(prev)) return {val:null, dir:'eq'};
  const d = (cur - prev) / prev;
  if (!isFinite(d)) return {val:null, dir:'eq'};
  return { val: d, dir: d > 0.005 ? 'up' : d < -0.005 ? 'dn' : 'eq' };
};

const dBadge = d => {
  if (d.val === null || !isFinite(d.val)) return '';
  if (d.dir === 'eq') return '';
  const pct = Math.abs(d.val * 100);
  const s = pct.toFixed(1).replace('.', ',');
  const sign = d.val > 0 ? '↑' : '↓';
  return `<div class="delta ${d.dir}">${sign} ${s}%</div>`;
};

const ytd = MONTHS.reduce((a,m) => {
  a.leads += m.leads; a.qualif += m.qualif; a.orc += m.orc;
  a.visitas += m.visitas; a.vendas += m.vendas; a.valor += m.valor;
  return a;
}, {leads:0,qualif:0,orc:0,visitas:0,vendas:0,valor:0});
ytd.ticket = ytd.vendas ? ytd.valor / ytd.vendas : 0;
ytd.convLV = ytd.leads ? ytd.vendas / ytd.leads : 0;
ytd.convQV = ytd.qualif ? ytd.vendas / ytd.qualif : 0;
ytd.qualRate = ytd.leads ? ytd.qualif / ytd.leads : 0;

const last = MONTHS[MONTHS.length - 1];
const prev = MONTHS[MONTHS.length - 2] || null;

if (last.partial) {

}

// ===== PANORAMA =====
function renderPanorama() {
  const p = document.getElementById('panorama');
  const monthsRange = MONTHS[0].name.substr(0,3) + ' – ' + MONTHS[MONTHS.length-1].name.substr(0,3) + ' 2026';
  const partial = last.partial ? '<span class="badge-partial">● parcial</span>' : '';

  const kpi = (kc, lbl, val, sub, d) => `
    <div class="card kpi" style="--kc:${kc}">
      <div class="lbl">${lbl}</div>
      <div class="val">${val}</div>
      <div class="sub">${sub}</div>
      ${d ? dBadge(d) : ''}
    </div>`;

  // Funnel steps for Hygibras
  const maxV = ytd.leads;
  const step = (lbl, val, color, pct1, pct2) => {
    const w = Math.max((val/maxV)*100, 5);
    return `<div class="step">
      <div class="step-label">${lbl}</div>
      <div class="step-bar" style="--sc:${color}; width:${w}%">${fmtBR(val)}</div>
      <div class="step-pct">${pct1 ? `<span class="p1">${pct1} L→V</span>` : `<span>${fmtPct(val/maxV)}</span>`}${pct2 ? `<span class="p2">${pct2} Q→V</span>` : ''}</div>
    </div>`;
  };

  // Insights
  const insights = [];
  if (last.partial) insights.push({c: C.visitas, t: `● ${last.name} em andamento — ${last.dias} dias úteis, dados parciais`});
  if (ytd.qualRate > 0.10) insights.push({c: C.success, t: `✓ Qualificação saudável (${fmtPct(ytd.qualRate)}) — funil recebendo leads relevantes`});
  else if (ytd.qualRate < 0.05) insights.push({c: C.alert, t: `⚠ Qualificação baixa (${fmtPct(ytd.qualRate)}) — revisar critérios ou fonte de leads`});
  if (ytd.convLV < 0.02) insights.push({c: C.alert, t: `⚠ Conv L→V baixa (${fmtPct(ytd.convLV)}) — gargalo entre qualificação e fechamento`});
  if (ytd.convQV > 0.25) insights.push({c: C.success, t: `✓ Time comercial fechando bem (Q→V ${fmtPct(ytd.convQV)})`});
  else if (ytd.convQV > 0 && ytd.convQV < 0.10) insights.push({c: C.alert, t: `⚠ Conv Q→V baixa (${fmtPct(ytd.convQV)}) — revisar abordagem/objeções`});
  if (prev && last.valor > prev.valor * 1.3 && !last.partial) insights.push({c: C.success, t: `↑ Crescimento expressivo em ${last.name}: receita subiu ${fmtPct((last.valor/prev.valor)-1)}`});
  if (prev && last.valor < prev.valor * 0.5 && !last.partial) insights.push({c: C.alert, t: `↓ Queda em ${last.name} vs ${prev.name}: investigar causas`});
  if (prev && last.ticket > prev.ticket * 1.1 && last.vendas > 0) insights.push({c: C.receita, t: `$ Ticket médio subiu ${fmtPct((last.ticket/prev.ticket)-1)} em ${last.name}`});
  if (ytd.visitas > 0 && ytd.qualif > 0) insights.push({c: C.visitas, t: `○ ${fmtPct(ytd.visitas/ytd.qualif)} dos qualificados foram visitados no YTD (${ytd.visitas} visitas)`});
  const best = MONTHS.filter(m=>!m.partial).reduce((a,m) => m.valor > (a?.valor||0) ? m : a, null);
  if (best) insights.push({c: C.receita, t: `★ Melhor mês YTD: ${best.name} — ${fmtRS(best.valor)} · ${best.vendas} vendas`});

  const tblRow = m => {
    const qr = m.leads ? m.qualif/m.leads : 0;
    const lv = m.leads ? m.vendas/m.leads : 0;
    const qv = m.qualif ? m.vendas/m.qualif : 0;
    return `<tr class="${m.partial?'partial':''}">
      <td>${m.name}${m.partial?' *':''}</td>
      <td class="num">${fmtBR(m.leads)}</td>
      <td class="num">${fmtBR(m.qualif)}</td>
      <td class="num">${fmtPct(qr)}</td>
      <td class="num">${fmtBR(m.orc)}</td>
      <td class="num">${fmtBR(m.visitas)}</td>
      <td class="num">${fmtBR(m.vendas)}</td>
      <td class="num" style="color:${C.convLV}">${fmtPct(lv)}</td>
      <td class="num" style="color:${C.convQV}">${fmtPct(qv)}</td>
      <td class="num">${fmtRS(m.valor)}</td>
    </tr>`;
  };

  p.innerHTML = `
    <div class="ytd-card">
      <div class="ytd-label">
        <div class="k">YTD ${monthsRange}</div>
        <div class="v">Resumo do funil ${partial}</div>
      </div>
      <div class="ytd-metrics">
        <div class="ytd-metric"><div class="lbl">Leads</div><div class="val leads">${fmtBR(ytd.leads)}</div></div>
        <div class="ytd-metric"><div class="lbl">Qualificados</div><div class="val qualif">${fmtBR(ytd.qualif)}</div></div>
        <div class="ytd-metric"><div class="lbl">Visitas</div><div class="val visitas">${fmtBR(ytd.visitas)}</div></div>
        <div class="ytd-metric"><div class="lbl">Vendas</div><div class="val vendas">${fmtBR(ytd.vendas)}</div></div>
        <div class="ytd-metric"><div class="lbl">Receita</div><div class="val receita">${fmtRSk(ytd.valor)}</div></div>
      </div>
    </div>

    <div class="grid g5 mb-24">
      ${kpi(C.leads, 'Leads em '+last.name, fmtBR(last.leads), fmtBR(last.dias)+' dias úteis', prev?delta(last.leads, prev.leads):null)}
      ${kpi(C.qualif, 'Qualificados', fmtBR(last.qualif), fmtPct(last.leads?last.qualif/last.leads:0), prev?delta(last.qualif, prev.qualif):null)}
      ${kpi(C.visitas, 'Visitas', fmtBR(last.visitas), fmtPct(last.qualif?last.visitas/last.qualif:0)+' dos qualif', prev?delta(last.visitas, prev.visitas):null)}
      ${kpi(C.vendas, 'Vendas', fmtBR(last.vendas), fmtPct(last.leads?last.vendas/last.leads:0)+' L→V', prev?delta(last.vendas, prev.vendas):null)}
      ${kpi(C.receita, 'Receita', fmtRSk(last.valor), 'Ticket '+fmtRSk(last.ticket), prev?delta(last.valor, prev.valor):null)}
    </div>

    <div class="grid g-2-1 mb-24">
      <div class="card">
        <h3>Funil consolidado YTD</h3>
        <div class="funnel">
          ${step('Leads', ytd.leads, C.leads)}
          ${step('Qualificados', ytd.qualif, C.qualif)}
          ${step('Orçamentos', ytd.orc, C.orc)}
          ${step('Visitas', ytd.visitas, C.visitas)}
          <div class="step">
            <div class="step-label">Vendas</div>
            <div class="step-bar" style="--sc:${C.vendas}; width:${Math.max((ytd.vendas/ytd.leads)*100,5)}%">${fmtBR(ytd.vendas)}</div>
            <div class="step-pct">
              <span class="p1">${fmtPct(ytd.convLV)} L→V</span>
              <span class="p2">${fmtPct(ytd.convQV)} Q→V</span>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>Insights automáticos</h3>
        <div class="insights">
          ${insights.map(i => `<div class="insight" style="--ic:${i.c}">${i.t}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="grid g2 mb-24">
      <div class="card">
        <h3>Receita mensal</h3>
        <div class="chart-wrap"><canvas id="chReceita"></canvas></div>
      </div>
      <div class="card">
        <h3>Leads · Visitas · Vendas por mês</h3>
        <div class="chart-wrap"><canvas id="chLVV"></canvas></div>
      </div>
    </div>

    <div class="card">
      <h3>Resumo mensal</h3>
      <table>
        <thead><tr>
          <th>Mês</th><th class="num">Leads</th><th class="num">Qualif</th>
          <th class="num">% Qualif</th><th class="num">Orçs</th><th class="num">Visitas</th>
          <th class="num">Vendas</th><th class="num">L→V</th><th class="num">Q→V</th><th class="num">Receita</th>
        </tr></thead>
        <tbody>
          ${MONTHS.map(tblRow).join('')}
          <tr class="total-row">
            <td>TOTAL YTD</td>
            <td class="num">${fmtBR(ytd.leads)}</td>
            <td class="num">${fmtBR(ytd.qualif)}</td>
            <td class="num">${fmtPct(ytd.qualRate)}</td>
            <td class="num">${fmtBR(ytd.orc)}</td>
            <td class="num">${fmtBR(ytd.visitas)}</td>
            <td class="num">${fmtBR(ytd.vendas)}</td>
            <td class="num" style="color:${C.convLV}">${fmtPct(ytd.convLV)}</td>
            <td class="num" style="color:${C.convQV}">${fmtPct(ytd.convQV)}</td>
            <td class="num">${fmtRS(ytd.valor)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  // Charts
  const mNames = MONTHS.map(m => m.name.substr(0,3));
  const partials = MONTHS.map(m => m.partial);
  const rcv = MONTHS.map(m => m.valor);
  const bgColors = partials.map(p => p ? C.receita + '80' : C.receita);

  new Chart(document.getElementById('chReceita'), {
    type:'bar',
    data:{labels: mNames, datasets:[{data: rcv, backgroundColor: bgColors, borderRadius:6, borderSkipped:false}]},
    options:{
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmtRS(c.parsed.y)}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>fmtRSk(v)}}},
      responsive:true, maintainAspectRatio:false
    }
  });

  new Chart(document.getElementById('chLVV'), {
    type:'bar',
    data:{
      labels: mNames,
      datasets:[
        {label:'Leads', data: MONTHS.map(m=>m.leads), backgroundColor: C.leads, borderRadius:6, borderSkipped:false, yAxisID:'y'},
        {label:'Visitas', data: MONTHS.map(m=>m.visitas), backgroundColor: C.visitas, borderRadius:6, borderSkipped:false, yAxisID:'y2'},
        {label:'Vendas', data: MONTHS.map(m=>m.vendas), backgroundColor: C.vendas, borderRadius:6, borderSkipped:false, yAxisID:'y2'},
      ]
    },
    options:{
      plugins:{legend:{display:true, labels:{color:'#9CA3AF', usePointStyle:true}}},
      scales:{
        y:{position:'left', ticks:{color:C.leads}, title:{display:true, text:'Leads', color:C.leads}},
        y2:{position:'right', grid:{display:false}, ticks:{color:C.vendas}, title:{display:true, text:'Visitas / Vendas', color:C.vendas}}
      },
      responsive:true, maintainAspectRatio:false
    }
  });
}

  `;
  const pills = document.getElementById('pillsSem');
  pills.innerHTML = MONTHS.map((m,i) => `<button class="month-pill ${i===currentMonthSem?'active':''}" data-i="${i}">${m.name}${m.partial?' ●':''}</button>`).join('');
  pills.querySelectorAll('.month-pill').forEach(b => b.onclick = () => {
    currentMonthSem = parseInt(b.dataset.i);
    pills.querySelectorAll('.month-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawSem();
  });
  drawSem();
}
let chSemBarInst, chSemRecInst;
function drawSem() {
  const m = MONTHS[currentMonthSem];
  document.getElementById('hSemTitle').textContent = `Detalhamento semanal · ${m.name}`;
  const wks = m.weeks;
  if (chSemBarInst) chSemBarInst.destroy();
  if (chSemRecInst) chSemRecInst.destroy();
  chSemBarInst = new Chart(document.getElementById('chSemBar'), {
    data:{
      labels: wks.map(w=>w.label),
      datasets:[
        {type:'bar', label:'Leads', data: wks.map(w=>w.leads), backgroundColor: C.leads, borderRadius:6, borderSkipped:false, yAxisID:'y'},
        {type:'bar', label:'Vendas', data: wks.map(w=>w.vendas), backgroundColor: C.vendas, borderRadius:6, borderSkipped:false, yAxisID:'y2'}
      ]
    },
    options:{
      plugins:{legend:{display:true, labels:{color:'#9CA3AF', usePointStyle:true}}},
      scales:{
        y:{ticks:{color:C.leads}, title:{display:true, text:'Leads', color:C.leads}},
        y2:{position:'right', grid:{display:false}, ticks:{color:C.vendas}, title:{display:true, text:'Vendas', color:C.vendas}}
      },
      responsive:true, maintainAspectRatio:false
    }
  });
  chSemRecInst = new Chart(document.getElementById('chSemRec'), {
    type:'line',
    data:{labels: wks.map(w=>w.label), datasets:[{label:'Receita', data: wks.map(w=>w.valor), borderColor: C.receita, backgroundColor:'rgba(245,158,11,0.15)', tension:0.3, fill:true, pointRadius:4, pointBackgroundColor:C.receita}]},
    options:{
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmtRS(c.parsed.y)}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>fmtRSk(v)}}},
      responsive:true, maintainAspectRatio:false
    }
  });
  // Table
  const bestIdx = wks.reduce((a,w,i)=> w.valor > wks[a].valor ? i : a, 0);
  const rows = wks.map((w,i) => {
    const qr = w.leads ? w.qualif/w.leads : 0;
    const lv = w.leads ? w.vendas/w.leads : 0;
    const qv = w.qualif ? w.vendas/w.qualif : 0;
    const isBest = i === bestIdx && w.valor > 0;
    return `<tr class="${isBest?'best-row':''}">
      <td>${isBest?'<span class="star">★</span>':''}${w.label}</td>
      <td class="num">${fmtBR(w.dias)}</td>
      <td class="num">${fmtBR(w.leads)}</td>
      <td class="num">${fmtBR(w.qualif)}</td>
      <td class="num">${fmtPct(qr)}</td>
      <td class="num">${fmtBR(w.vendas)}</td>
      <td class="num" style="color:${C.convLV}">${fmtPct(lv)}</td>
      <td class="num" style="color:${C.convQV}">${fmtPct(qv)}</td>
      <td class="num">${fmtRS(w.valor)}</td>
      <td class="num">${w.ticket ? fmtRS(w.ticket) : '—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('tblSem').innerHTML = `
    <thead><tr>
      <th>Semana</th><th class="num">Dias</th><th class="num">Leads</th><th class="num">Qualif</th>
      <th class="num">% Qualif</th><th class="num">Vendas</th><th class="num">L→V</th><th class="num">Q→V</th>
      <th class="num">Receita</th><th class="num">Ticket</th>
    </tr></thead><tbody>${rows}</tbody>
  `;
}

// ===== ORIGENS =====
let currentMonthOri = MONTHS.length - 1;
function renderOrigens() {
  const p = document.getElementById('origens');
  p.innerHTML = `
    <div class="month-pills" id="pillsOri"></div>
    <div class="grid g2 mb-24">
      <div class="card">
        <h3>Leads por origem</h3>
        <div class="chart-wrap"><canvas id="chOriBar"></canvas></div>
      </div>
      <div class="card">
        <h3>Participação (%)</h3>
        <div class="chart-wrap"><canvas id="chOriDonut"></canvas></div>
      </div>
    </div>
    <div class="card">
      <h3>Ranking de vendedores YTD</h3>
      <div id="ranking"></div>
    </div>
  `;
  const pills = document.getElementById('pillsOri');
  pills.innerHTML = `<button class="month-pill active" data-i="ytd">YTD</button>` + MONTHS.map((m,i) => `<button class="month-pill" data-i="${i}">${m.name}</button>`).join('');
  pills.querySelectorAll('.month-pill').forEach(b => b.onclick = () => {
    currentMonthOri = b.dataset.i === 'ytd' ? 'ytd' : parseInt(b.dataset.i);
    pills.querySelectorAll('.month-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawOri();
  });
  currentMonthOri = 'ytd';
  drawOri();
  drawRanking();
}
let chOriBarInst, chOriDonutInst;
function drawOri() {
  let orig;
  if (currentMonthOri === 'ytd') {
    orig = MONTHS.reduce((a,m) => {
      for (const k in m.origins) a[k] = (a[k]||0) + m.origins[k];
      return a;
    }, {});
  } else {
    orig = {...MONTHS[currentMonthOri].origins};
  }
  const labels = Object.keys(orig);
  const values = Object.values(orig);
  const total = values.reduce((a,b)=>a+b,0);
  if (chOriBarInst) chOriBarInst.destroy();
  if (chOriDonutInst) chOriDonutInst.destroy();
  chOriBarInst = new Chart(document.getElementById('chOriBar'), {
    type:'bar',
    data:{labels, datasets:[{data: values, backgroundColor: C.cat.slice(0, labels.length), borderRadius:6, borderSkipped:false}]},
    options:{
      indexAxis:'y',
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmtBR(c.parsed.x) + ' (' + fmtPct(c.parsed.x/total) + ')'}}},
      scales:{x:{beginAtZero:true}},
      responsive:true, maintainAspectRatio:false
    }
  });
  chOriDonutInst = new Chart(document.getElementById('chOriDonut'), {
    type:'doughnut',
    data:{labels, datasets:[{data: values, backgroundColor: C.cat.slice(0, labels.length), borderWidth:0}]},
    options:{
      cutout:'60%',
      plugins:{legend:{display:true, position:'right', labels:{color:'#9CA3AF', usePointStyle:true, padding:12}}, tooltip:{callbacks:{label:c=>c.label + ': ' + fmtBR(c.parsed) + ' (' + fmtPct(c.parsed/total) + ')'}}},
      responsive:true, maintainAspectRatio:false
    }
  });
}
function drawRanking() {
  const stats = {};
  for (const m of MONTHS) {
    for (const v of (m.vendas_list || [])) {
      if (!v.vendedor) continue;
      if (!stats[v.vendedor]) stats[v.vendedor] = {vendas:0, valor:0};
      stats[v.vendedor].vendas += 1;
      stats[v.vendedor].valor += v.valor || 0;
    }
  }
  const arr = Object.entries(stats).map(([k,v]) => ({nome:k, ...v})).sort((a,b) => b.valor - a.valor);
  const medals = ['medal-1','medal-2','medal-3'];
  const html = `<table><thead><tr>
    <th>#</th><th>Vendedor</th><th class="num">Vendas</th><th class="num">Receita</th><th class="num">Ticket médio</th>
  </tr></thead><tbody>
    ${arr.map((v,i) => `<tr>
      <td>${i<3?`<span class="medal ${medals[i]}">${i+1}</span>`:'<span style="margin-left:8px">'+(i+1)+'</span>'}</td>
      <td>${v.nome}</td>
      <td class="num">${v.vendas}</td>
      <td class="num">${fmtRS(v.valor)}</td>
      <td class="num">${fmtRS(v.valor/v.vendas)}</td>
    </tr>`).join('') || '<tr><td colspan="5" style="color:var(--text-mute); text-align:center; padding:20px">Sem vendas registradas ainda</td></tr>'}
  </tbody></table>`;
  document.getElementById('ranking').innerHTML = html;
}

// ===== VISITAS =====
let currentMonthVis = MONTHS.length - 1;
function renderVisitas() {
  const p = document.getElementById('visitas');
  p.innerHTML = `
    <div class="month-pills" id="pillsVis"></div>
    <div class="mb-24" id="visKpis" style="max-width: 400px;"></div>
    <div class="card">
      <h3>Lista de visitas</h3>
      <div class="grid g2" id="visList"></div>
    </div>
  `;
  const pills = document.getElementById('pillsVis');
  pills.innerHTML = `<button class="month-pill active" data-i="ytd">YTD</button>` + MONTHS.map((m,i) => `<button class="month-pill" data-i="${i}">${m.name}</button>`).join('');
  pills.querySelectorAll('.month-pill').forEach(b => b.onclick = () => {
    currentMonthVis = b.dataset.i === 'ytd' ? 'ytd' : parseInt(b.dataset.i);
    pills.querySelectorAll('.month-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawVis();
  });
  currentMonthVis = 'ytd';
  drawVis();
}
function drawVis() {
  let totalV, totalQ, list;
  if (currentMonthVis === 'ytd') {
    totalV = ytd.visitas; totalQ = ytd.qualif;
    list = MONTHS.flatMap(m => m.visitas_list.map(v => ({...v, mes: m.name})));
  } else {
    const m = MONTHS[currentMonthVis];
    totalV = m.visitas; totalQ = m.qualif;
    list = m.visitas_list.map(v => ({...v, mes: m.name}));
  }
  // conv Visita -> Venda (approx: ytd vendas from list where match)
  let convVV = 0;
  if (currentMonthVis === 'ytd' && ytd.visitas) convVV = ytd.vendas / ytd.visitas;
  else if (currentMonthVis !== 'ytd') {
    const m = MONTHS[currentMonthVis];
    convVV = m.visitas ? m.vendas / m.visitas : 0;
  }
  document.getElementById('visKpis').innerHTML = `
    <div class="card kpi" style="--kc:${C.visitas}"><div class="lbl">Total de Visitas</div><div class="val">${fmtBR(totalV)}</div><div class="sub">${list.length} registro(s)</div></div>
  `;
  document.getElementById('visList').innerHTML = list.length
    ? list.map(v => `<div class="visit-card"><div class="name">${v.cliente}${currentMonthVis==='ytd'?` <span style="color:var(--text-mute)">· ${v.mes}</span>`:''}</div><span class="pill ${v.status==='ok'?'pill-ok':'pill-pending'}">${v.status==='ok'?'OK':'Pendente'}</span></div>`).join('')
    : '<div style="grid-column:span 2; color:var(--text-mute); text-align:center; padding:20px">Sem visitas registradas</div>';
}

// ===== VENDAS FECHADAS =====
let currentMonthVend = MONTHS.length - 1;
function renderVendas() {
  const p = document.getElementById('vendas');
  p.innerHTML = `
    <div class="month-pills" id="pillsVend"></div>
    <div class="grid g3 mb-24" id="vendKpis"></div>
    <div class="card">
      <h3 id="hVendTitle">Vendas fechadas</h3>
      <table id="tblVend"></table>
    </div>
  `;
  const pills = document.getElementById('pillsVend');
  pills.innerHTML = `<button class="month-pill active" data-i="ytd">YTD</button>` + MONTHS.map((m,i) => `<button class="month-pill" data-i="${i}">${m.name}</button>`).join('');
  pills.querySelectorAll('.month-pill').forEach(b => b.onclick = () => {
    currentMonthVend = b.dataset.i === 'ytd' ? 'ytd' : parseInt(b.dataset.i);
    pills.querySelectorAll('.month-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawVend();
  });
  currentMonthVend = 'ytd';
  drawVend();
}
function drawVend() {
  let list, tv, tr;
  if (currentMonthVend === 'ytd') {
    list = MONTHS.flatMap(m => m.vendas_list.map(v => ({...v, mes: m.name})));
    tv = ytd.vendas; tr = ytd.valor;
  } else {
    const m = MONTHS[currentMonthVend];
    list = m.vendas_list.map(v => ({...v, mes: m.name}));
    tv = m.vendas; tr = m.valor;
  }
  const tk = tv ? tr/tv : 0;
  const listTotal = list.reduce((a,v) => a + (v.valor||0), 0);
  document.getElementById('hVendTitle').textContent = 'Vendas fechadas — ' + (currentMonthVend==='ytd' ? 'YTD' : MONTHS[currentMonthVend].name);
  document.getElementById('vendKpis').innerHTML = `
    <div class="card kpi" style="--kc:${C.vendas}"><div class="lbl">Total Vendas</div><div class="val">${fmtBR(tv)}</div><div class="sub">${list.length} lançamento(s)</div></div>
    <div class="card kpi" style="--kc:${C.receita}"><div class="lbl">Receita</div><div class="val">${fmtRS(tr)}</div><div class="sub">${list.length ? 'Lista soma '+fmtRS(listTotal) : ''}</div></div>
    <div class="card kpi" style="--kc:${C.ticket}"><div class="lbl">Ticket médio</div><div class="val">${fmtRS(tk)}</div></div>
  `;
  document.getElementById('tblVend').innerHTML = list.length ? `
    <thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Origem</th><th class="num">Valor</th>${currentMonthVend==='ytd'?'<th>Mês</th>':''}</tr></thead>
    <tbody>
      ${list.map(v => `<tr>
        <td>${v.data}</td>
        <td>${v.cliente}</td>
        <td>${v.vendedor}</td>
        <td>${v.origem}</td>
        <td class="num">${fmtRS(v.valor)}</td>
        ${currentMonthVend==='ytd'?`<td>${v.mes}</td>`:''}
      </tr>`).join('')}
    </tbody>
  ` : '<tbody><tr><td colspan="6" style="color:var(--text-mute); text-align:center; padding:20px">Sem vendas registradas</td></tr></tbody>';
}

// Tab switching
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
