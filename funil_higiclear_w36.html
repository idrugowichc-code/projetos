<head>
<meta charset="utf-8">
<title>Higiclear — Funil de Vendas 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0A0E1A;--bg-card:#111827;--bg-elev:#1F2937;--bg-hover:#374151;
  --border:#1F2937;--border-strong:#374151;
  --text:#F9FAFB;--text-dim:#9CA3AF;--text-mute:#6B7280;
  --c-leads:#3B82F6;--c-qualif:#8B5CF6;--c-orc:#06B6D4;--c-vendas:#10B981;
  --c-receita:#F59E0B;--c-ticket:#EC4899;--c-conv-lv:#10B981;--c-conv-qv:#14B8A6;
  --c-alert:#EF4444;--c-success:#22C55E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.4}
a{color:var(--c-leads);text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:24px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.header .sub{color:var(--text-dim);font-size:12px;margin-top:4px}
.header .badge-partial{display:inline-block;background:#F59E0B22;color:#F59E0B;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-top:6px}
.btn-export{background:#3B82F6;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px}
.btn-export:hover{background:#2563EB}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-strong);margin-bottom:20px}
.tab{padding:10px 16px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;font-size:13px;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--c-leads)}
.pane{display:none}
.pane.active{display:block}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px}
.card + .card{margin-top:16px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:1fr 1fr}
.grid-2-1{grid-template-columns:2fr 1fr}
@media (max-width:900px){.grid-4,.grid-3,.grid-2,.grid-2-1{grid-template-columns:1fr}}

/* YTD card */
.ytd{background:linear-gradient(135deg,#111827 0%,#1F2937 100%);border:1px solid #374151;border-radius:12px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center;margin-bottom:16px}
.ytd-label{border-right:1px solid var(--border-strong);padding-right:22px}
.ytd-label .kicker{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ytd-label .period{font-size:16px;font-weight:700;margin-top:4px}
.ytd-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.ytd-m .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:600;margin-bottom:4px}
.ytd-m .val{font-size:24px;font-weight:700}
.ytd-m .sub{font-size:11px;color:var(--text-mute);margin-top:2px}

/* KPI cards */
.kpi{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--c-leads);border-radius:10px;padding:14px 16px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px}
.kpi .sub{font-size:11px;color:var(--text-mute);margin-top:2px}
.delta{display:inline-block;font-size:11px;padding:3px 7px;border-radius:5px;margin-top:6px;font-weight:600}
.delta.up{background:#10B98122;color:#10B981}
.delta.dn{background:#EF444422;color:#EF4444}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:12px}
.frow .flbl{font-size:12px;color:var(--text-dim);font-weight:500}
.fbar-wrap{background:#0F1521;border-radius:6px;height:36px;position:relative;overflow:hidden}
.fbar{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:12px;color:#0A0E1A;transition:width .3s}
.fval{text-align:right;font-size:13px;font-weight:600}
.fval .conv{font-size:11px;color:var(--text-dim);font-weight:500;margin-left:6px}
.fval-stack{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.conv-tag{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px}

/* Insights */
.insight{display:flex;gap:10px;padding:10px 12px;background:var(--bg-elev);border-left:3px solid var(--c-leads);border-radius:6px;margin-bottom:8px;font-size:12.5px}
.insight.warn{border-left-color:var(--c-alert)}
.insight.ok{border-left-color:var(--c-success)}
.insight.info{border-left-color:var(--c-orc)}
.insight.money{border-left-color:var(--c-receita)}

/* Tables */
table{width:100%;border-collapse:collapse}
th{color:#E5E7EB;background:#0F1521;border-bottom:2px solid #374151;padding:10px 8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:9px 8px;border-bottom:1px solid var(--border);font-size:12.5px}
tr:hover td{background:#0F1521}
tr.partial td{color:#D1D5DB;font-style:italic}
tr.total td{background:#0F1521;border-top:2px solid #374151;font-weight:700;color:#F9FAFB;padding:12px 8px}
tr.best td{background:linear-gradient(90deg,#10B98115 0%,transparent 100%);font-weight:600}
.star{color:#F59E0B;margin-right:4px}

/* Pills */
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:6px 12px;background:var(--bg-elev);color:var(--text-dim);border-radius:16px;cursor:pointer;font-size:12px;border:1px solid transparent;transition:.15s;font-weight:500}
.pill:hover{color:var(--text)}
.pill.active{background:var(--c-leads);color:#fff;border-color:var(--c-leads)}

/* Chart legend */
.legend{display:flex;gap:16px;justify-content:center;margin-bottom:10px;font-size:12px;color:var(--text-dim)}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart-wrap{position:relative;height:280px}
.chart-tall{height:340px}

/* Ranking */
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:32px 1fr 100px 90px;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-elev);border-radius:8px}
.rank-medal{font-size:18px;text-align:center}
.rank-name{font-weight:600;font-size:13px}
.rank-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.rank-val{text-align:right;font-weight:700;font-size:14px}
.rank-count{text-align:right;font-size:11px;color:var(--text-dim)}

/* Origin badges */
.badge-origin{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
</style>

// Utils
const fmt = {
  int: n => (n||0).toLocaleString('pt-BR'),
  brl: n => 'R$ ' + (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
  pct: n => (n===null||n===undefined||!isFinite(n)) ? '—' : (n*100).toFixed(1).replace('.',',') + '%',
  delta: (cur, prev) => {
    if (prev === null || prev === undefined || prev === 0 || !isFinite(prev)) return {val:null, dir:'eq'};
    const d = (cur - prev) / prev;
    if (!isFinite(d)) return {val:null, dir:'eq'};
    return { val:d, dir: d > 0.005 ? 'up' : d < -0.005 ? 'dn' : 'eq' };
  }
};
const dBadge = d => {
  if (d.val === null || !isFinite(d.val)) return '';
  if (d.dir === 'eq') return '';
  const pct = Math.abs(d.val * 100);
  const s = pct.toFixed(1).replace('.',',');
  const sign = d.val > 0 ? '↑' : '↓';
  return `<div class="delta ${d.dir}">${sign} ${s}%</div>`;
};

    {label:'Vendas', val:YTD.vendas, color:C.vendas, isLast:true},

  const max = stages[0].val;
  el.innerHTML = stages.map(s=>{
    const pct = Math.max(5, (s.val/max)*100);
    let convHtml = '';
    if (s.isLast) {

      </div>`;
    } else if (s.conv !== undefined) {
      convHtml = `<div class="fval">${fmt.int(s.val)}<div style="font-size:10.5px;color:var(--text-mute);margin-top:2px">${fmt.pct(s.conv)} da etapa anterior</div></div>`;
    } else {
      convHtml = `<div class="fval">${fmt.int(s.val)}</div>`;
    }
    return `<div class="frow">
      <div class="flbl">${s.label}</div>
      <div class="fbar-wrap"><div class="fbar" style="width:${pct}%;background:${s.color}">${fmt.int(s.val)}</div></div>

    </div>`;

}

function renderInsights(){
  const el = document.getElementById('insightsList');
  const items = [];
  const l = LAST.totals;
  const prev = MONTHS[MONTHS.length-2]?.totals;
  const qualRate = l.qualif / (l.leads||1);
  const convLV = l.vendas / (l.leads||1);
  const convQV = l.vendas / (l.qualif||1);

  if (LAST.partial) items.push({t:'info', txt:`● ${LAST.name} em andamento — ${l.dias} dias úteis, dados parciais`});
  if (qualRate > 0.1) items.push({t:'ok', txt:`✓ Qualificação saudável: ${fmt.pct(qualRate)} dos leads viraram MQL em ${LAST.name}`});
  else if (qualRate < 0.05) items.push({t:'warn', txt:`⚠ Qualificação baixa: apenas ${fmt.pct(qualRate)} dos leads foram qualificados em ${LAST.name}`});
  if (convLV < 0.02) items.push({t:'warn', txt:`⚠ Conv L→V de ${fmt.pct(convLV)} em ${LAST.name} — gargalo no funil, revise qualificação/velocidade`});
  if (convQV > 0.25) items.push({t:'ok', txt:`✓ Time comercial fechando bem: ${fmt.pct(convQV)} dos qualificados fecharam em ${LAST.name}`});
  else if (convQV > 0 && convQV < 0.1) items.push({t:'warn', txt:`⚠ Conv Q→V de ${fmt.pct(convQV)} em ${LAST.name} — revisar abordagem comercial`});
  if (prev && l.receita > prev.receita * 1.3) items.push({t:'ok', txt:`↑ Crescimento expressivo: receita de ${LAST.name} cresceu ${fmt.pct((l.receita-prev.receita)/prev.receita)} vs mês anterior`});
  else if (prev && l.receita < prev.receita * 0.5 && !LAST.partial) items.push({t:'warn', txt:`↓ Queda que requer investigação: receita de ${LAST.name} caiu ${fmt.pct((prev.receita-l.receita)/prev.receita)} vs mês anterior`});
  if (prev && prev.vendas > 0 && l.vendas > 0){
    const tCur = l.receita/l.vendas, tPrev = prev.receita/prev.vendas;
    if (tCur > tPrev * 1.1) items.push({t:'money', txt:`$ Ticket médio subiu para ${fmt.brl(tCur)} em ${LAST.name} (era ${fmt.brl(tPrev)})`});
  }
  // Best month YTD
  let best = MONTHS[0];
  for (const m of MONTHS) if (m.totals.receita > best.totals.receita) best = m;
  items.push({t:'money', txt:`★ Melhor mês YTD: ${best.name} — ${fmt.brl(best.totals.receita)} em ${best.totals.vendas} vendas`});

  el.innerHTML = items.map(i=>`<div class="insight ${i.t}">${i.txt}</div>`).join('');
}

      <div class="rank-list" id="rankSellers"></div>
    </div>
  `;
  p.querySelectorAll('.pill').forEach(pl=>pl.onclick = ()=>{ origMonth = +pl.dataset.i; renderOrigens(); });

  // Aggregate channels
  const chLabels = ['Email','Krolic','General Clean','RD','Outbound'];
  let chData;
  if (origMonth === -1) {
    chData = chLabels.map(l => MONTHS.reduce((s,m)=>s+(m.channels[l]||0),0));
  } else {
    chData = chLabels.map(l => MONTHS[origMonth].channels[l]||0);
  }
  makeChart('chChBar', {
    type:'bar', data:{labels:chLabels, datasets:[{data:chData, backgroundColor:CH_PALETTE, borderRadius:6, borderSkipped:false}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#1F293780'}}, y:{grid:{display:false}}}, maintainAspectRatio:false}
  });
  const total = chData.reduce((a,b)=>a+b,0);
  makeChart('chChDonut', {
    type:'doughnut', data:{labels:chLabels, datasets:[{data:chData, backgroundColor:CH_PALETTE, borderColor:'#111827', borderWidth:2}]},
    options:{plugins:{legend:{position:'right', labels:{padding:12, generateLabels:c=>{
      const d = c.data.datasets[0].data;
      return c.data.labels.map((l,i)=>({text:`${l} — ${((d[i]/total)*100).toFixed(1).replace('.',',')}%`, fillStyle:CH_PALETTE[i], strokeStyle:CH_PALETTE[i], index:i}));
    }}}}, cutout:'55%', maintainAspectRatio:false}
  });

  // Rank sellers
  const sales = origMonth === -1 ? MONTHS.flatMap(m=>m.sales_list) : MONTHS[origMonth].sales_list;
  const bySeller = {};
  for (const s of sales) {
    const name = (s.vendedor||'?').replace(/\s+/g,' ').trim();
    // Normalize: MICHELLE / HUNTER02 SUELY / HUNTER01 WASHINGTON
    let display = name;
    let upper = name.toUpperCase();
    if (upper.includes('MICHELLE')) display = 'Michelle';
    else if (upper.includes('HUNTER02') || upper.includes('SUELY')) display = 'Suely (Hunter02)';
    else if (upper.includes('HUNTER01') || upper.includes('WASHINGTON')) display = 'Washington (Hunter01)';
    if (!bySeller[display]) bySeller[display] = {count:0, receita:0};
    bySeller[display].count += 1;
    bySeller[display].receita += s.valor;
  }
  const ranked = Object.entries(bySeller).sort((a,b)=>b[1].receita-a[1].receita);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('rankSellers').innerHTML = ranked.length ? ranked.map((r,i)=>`
    <div class="rank-row">
      <div class="rank-medal">${medals[i]||''}</div>
      <div><div class="rank-name">${r[0]}</div><div class="rank-sub">${r[1].count} vendas</div></div>
      <div class="rank-val" style="color:${C.receita}">${fmt.brl(r[1].receita)}</div>
      <div class="rank-count">Ticket ${fmt.brl(r[1].receita/r[1].count)}</div>
    </div>
  `).join('') : '<div style="color:var(--text-mute);font-size:12px">Sem vendas registradas.</div>';
}

function normalizeSeller(v){
  const u = (v||'').toUpperCase();
  if (u.includes('MICHELLE')) return 'Michelle';
  if (u.includes('HUNTER02')||u.includes('SUELY')) return 'Suely';
  if (u.includes('HUNTER01')||u.includes('WASHINGTON')) return 'Washington';
  return v || '—';
}
function badgeOrigem(o){
  if (!o) return '<span class="badge-origin" style="background:#37415188;color:#9CA3AF">—</span>';
  const u = o.toUpperCase();
  let color = CH_PALETTE[0];
  if (u.includes('BUSCA')) color = CH_PALETTE[0];
  else if (u.includes('GENERAL') || u.includes('GC')) color = CH_PALETTE[2];
  else if (u.includes('KROLIC')) color = CH_PALETTE[1];
  else if (u.includes('INDICA')) color = CH_PALETTE[4];
  else if (u.includes('RD') || u.includes('LEVANT')) color = CH_PALETTE[3];
  else color = CH_PALETTE[5];
  return `<span class="badge-origin" style="background:${color}22;color:${color}">${o}</span>`;
}
