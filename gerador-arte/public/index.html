<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Arte Comercial — Higiclear</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2230; --border:#2a3038;
    --txt:#e6edf3; --txt-dim:#8b949e; --accent:#1fb6c4; --accent-2:#0e7c8a; --ok:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;padding:28px}
  .wrap{max-width:1240px;margin:0 auto}
  header h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  header p{color:var(--txt-dim);font-size:14px;margin-top:4px}
  .layout{display:grid;grid-template-columns:1fr 480px;gap:28px;margin-top:26px;align-items:start}
  @media(max-width:980px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}
  .bar{display:flex;gap:10px;margin-bottom:16px}
  .bar input{flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none}
  .bar input:focus{border-color:var(--accent)}
  .bar select{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;color:var(--txt);font-size:14px;outline:none}
  .count{font-size:13px;color:var(--txt-dim);margin-bottom:12px}
  .count b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-height:620px;overflow-y:auto;padding-right:6px}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:11px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--accent-2);transform:translateY(-2px)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card.sel::after{content:"✓";position:absolute;top:8px;right:8px;background:var(--accent);color:#04222a;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
  .card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:7px;margin-bottom:8px}
  .card .noimg{width:100%;aspect-ratio:1;background:#0d2530;border-radius:7px;margin-bottom:8px;display:grid;place-items:center;color:#3a5560;font-size:11px}
  .card .nm{font-size:12.5px;font-weight:600;line-height:1.3}
  .card .ct{font-size:11px;color:var(--txt-dim);margin-top:3px}
  .side{position:sticky;top:28px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--txt-dim)}
  .tab.on{background:var(--accent);color:#04222a;font-weight:700;border-color:var(--accent)}
  .stage{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
  #art{width:450px;background:linear-gradient(160deg,#f8fafb 0%,#eef3f5 100%);border-radius:16px;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#0d2530}
  .art-head{background:linear-gradient(135deg,#0e7c8a,#1fb6c4);padding:18px 22px;color:#fff}
  .art-head .brand{font-size:20px;font-weight:800;letter-spacing:.5px}
  .art-head .tag{font-size:11.5px;opacity:.9;margin-top:2px;letter-spacing:.3px}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#dfe7ea;padding:2px}
  .cell{background:#fff;padding:16px 14px;min-height:182px;display:flex;flex-direction:column}
  .cell img{width:100%;height:104px;object-fit:contain;margin-bottom:9px}
  .cell .noimg2{width:100%;height:104px;background:#f0f4f5;border-radius:6px;margin-bottom:9px;display:grid;place-items:center;color:#b8c4c9;font-size:11px}
  .cell .pn{font-size:13.5px;font-weight:700;line-height:1.25;color:#0d2530}
  .cell .pd{font-size:11px;color:#5a6b72;line-height:1.35;margin-top:5px;flex:1;outline:none;border-radius:4px}
  .cell .pd:focus{background:#eaf6f8;box-shadow:0 0 0 2px var(--accent)}
  .cell .pd[data-empty]::before{content:"Clique para escrever a descrição...";color:#b0bcc2;font-style:italic}
  .cell.empty{align-items:center;justify-content:center;color:#b8c4c9;font-size:13px;border:2px dashed #d5dee1}
  .art-foot{background:#0d2530;color:#fff;padding:13px 22px;display:flex;justify-content:center;align-items:center}
  .art-foot .site{font-size:12.5px;font-weight:600;letter-spacing:.3px}
  .actions{margin-top:16px;display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn-pri{background:var(--accent);color:#04222a}
  .btn-pri:hover{background:#26cdde}
  .btn-pri:disabled{opacity:.4;cursor:not-allowed}
  .btn-sec{background:var(--panel-2);color:var(--txt);border:1px solid var(--border);flex:0 0 auto;padding:13px 18px}
  .hint{font-size:12px;color:var(--txt-dim);margin-top:10px;text-align:center}
  .loading{padding:40px;text-align:center;color:var(--txt-dim)}
  .err{padding:20px;background:#3d1d1d;border:1px solid #6b2b2b;border-radius:10px;color:#ffb3b3;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gerador de Arte Comercial</h1>
    <p>Selecione até 4 produtos · gere a arte · envie no WhatsApp</p>
  </header>
  <div class="layout">
    <div class="panel">
      <div class="bar">
        <input id="search" placeholder="Buscar produto...">
        <select id="cat"><option value="">Todas categorias</option></select>
      </div>
      <div class="count">Selecionados: <b id="selcount">0</b> / 4 <span id="updated" style="float:right"></span></div>
      <div class="grid" id="catalog"><div class="loading">Carregando catálogo…</div></div>
    </div>
    <div class="side">
      <div class="tabs">
        <div class="tab on" data-brand="higiclear">Higiclear</div>
        <div class="tab" data-brand="hygibras">Hygibras</div>
      </div>
      <div class="stage">
        <div id="art">
          <div class="art-head">
            <div class="brand" id="artBrand">HIGICLEAR</div>
            <div class="tag" id="artTag">Higiene e limpeza profissional</div>
          </div>
          <div class="quad" id="quad"></div>
          <div class="art-foot">
            <span class="site" id="artSite">higiclear.com</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-pri" id="gen" disabled>Gerar imagem (PNG)</button>
        <button class="btn btn-sec" id="clear">Limpar</button>
      </div>
      <div class="hint">Dica: selecione 4 produtos para a arte ficar completa.</div>
    </div>
  </div>
</div>
<script>
// ===== CONFIG: ajuste a URL do catálogo após publicar no GitHub Pages =====
const CATALOG_URL = 'catalogo.json'; // mesmo diretório do HTML no Pages

const BRANDS = {
  higiclear:{name:"HIGICLEAR",tag:"Higiene e limpeza profissional",site:"higiclear.com"},
  hygibras:{name:"HYGIBRAS",tag:"Soluções em higienização",site:"hygibras.com"}
};

let PRODUCTS = [];
let selected = [];
let brand = "higiclear";
let editedText = {}; // texto ajustado na hora pelo vendedor {id: texto}

async function boot(){
  try{
    const r = await fetch(CATALOG_URL, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    PRODUCTS = data.products || [];
    if(data.updated){
      const d = new Date(data.updated);
      document.getElementById('updated').textContent = 'Atualizado: '+d.toLocaleDateString('pt-BR');
    }
    const cats=[...new Set(PRODUCTS.map(p=>p.cat))].sort();
    const catSel=document.getElementById('cat');
    cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o)});
    renderCatalog(); renderArt();
  }catch(e){
    document.getElementById('catalog').innerHTML =
      `<div class="err">Não foi possível carregar o catálogo (${e.message}).<br><br>
       Verifique se o <b>catalogo.json</b> está publicado no GitHub Pages e se a URL em <b>CATALOG_URL</b> está correta.</div>`;
  }
}

function renderCatalog(){
  const q=document.getElementById('search').value.toLowerCase();
  const c=document.getElementById('cat').value;
  const grid=document.getElementById('catalog');
  grid.innerHTML='';
  const list=PRODUCTS.filter(p=>(!c||p.cat===c)&&((p.name||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)));
  if(list.length===0){grid.innerHTML='<div class="loading">Nenhum produto encontrado.</div>';return;}
  list.forEach(p=>{
    const d=document.createElement('div');
    d.className='card'+(selected.find(s=>s.id===p.id)?' sel':'');
    const imgHtml=p.img?`<img src="${p.img}" crossorigin="anonymous">`:`<div class="noimg">sem foto</div>`;
    d.innerHTML=`${imgHtml}<div class="nm">${p.name}</div><div class="ct">${p.cat}</div>`;
    d.onclick=()=>toggle(p);
    grid.appendChild(d);
  });
}

function toggle(p){
  const i=selected.findIndex(s=>s.id===p.id);
  if(i>=0) selected.splice(i,1);
  else{ if(selected.length>=4){alert('Máximo de 4 produtos.');return;} selected.push(p); }
  renderCatalog(); renderArt();
}

function renderArt(){
  const quad=document.getElementById('quad');
  quad.innerHTML='';
  for(let i=0;i<4;i++){
    const p=selected[i];
    const cell=document.createElement('div');
    if(p){
      cell.className='cell';
      const imgHtml=p.img?`<img src="${p.img}" crossorigin="anonymous">`:`<div class="noimg2">sem imagem</div>`;
      const txt = editedText[p.id] !== undefined ? editedText[p.id] : (p.desc||'');
      const ph = txt.trim()==='' ? ' data-empty="1"' : '';
      cell.innerHTML=`${imgHtml}<div class="pn">${p.name}</div><div class="pd" contenteditable="true" data-id="${p.id}"${ph}>${txt}</div>`;
      const pd=cell.querySelector('.pd');
      pd.addEventListener('input',e=>{ editedText[p.id]=e.target.textContent; e.target.removeAttribute('data-empty'); });
    }else{ cell.className='cell empty'; cell.textContent='Produto '+(i+1); }
    quad.appendChild(cell);
  }
  document.getElementById('selcount').textContent=selected.length;
  const btnGen=document.getElementById('gen');
  btnGen.disabled = selected.length !== 4;
  btnGen.textContent = selected.length === 4 ? 'Gerar imagem (PNG)' : `Selecione 4 produtos (${selected.length}/4)`;
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); brand=t.dataset.brand;
  const b=BRANDS[brand];
  document.getElementById('artBrand').textContent=b.name;
  document.getElementById('artTag').textContent=b.tag;
  document.getElementById('artSite').textContent=b.site;
});

document.getElementById('search').oninput=renderCatalog;
document.getElementById('cat').onchange=renderCatalog;
document.getElementById('clear').onclick=()=>{selected=[];editedText={};renderCatalog();renderArt();};
document.getElementById('gen').onclick=()=>{
  // trava: todas as 4 descrições precisam estar preenchidas
  const vazios=[...document.querySelectorAll('#quad .pd')].filter(el=>el.textContent.trim()==='');
  if(selected.length!==4){ alert('Selecione exatamente 4 produtos.'); return; }
  if(vazios.length){ alert('Preencha a descrição de todos os 4 produtos antes de gerar.'); vazios[0].focus(); return; }
  const btn=document.getElementById('gen');
  btn.textContent='Gerando...'; btn.disabled=true;
  html2canvas(document.getElementById('art'),{scale:3,useCORS:true,backgroundColor:null}).then(canvas=>{
    const a=document.createElement('a');
    a.download=`arte-${brand}-${Date.now()}.png`;
    a.href=canvas.toDataURL('image/png'); a.click();
    btn.textContent='Gerar imagem (PNG)'; btn.disabled=false;
  }).catch(e=>{ alert('Erro ao gerar imagem: '+e.message); btn.textContent='Gerar imagem (PNG)'; btn.disabled=false; });
};

boot();
</script>
</body>
</html>
