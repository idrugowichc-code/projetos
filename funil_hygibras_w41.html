<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hygibras · Dashboard do Funil 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --c-leads:#3B82F6; --c-qualif:#8B5CF6; --c-visitas:#F97316;
    --c-orc:#06B6D4; --c-vendas:#10B981; --c-receita:#F59E0B;
    --c-ticket:#EC4899; --c-conv-lv:#10B981; --c-conv-qv:#14B8A6;
    --c-alert:#EF4444; --c-success:#22C55E;
    --bg:#0A0E1A; --bg-card:#111827; --bg-elev:#1F2937; --bg-hover:#374151;
    --border:#1F2937; --border-strong:#374151;
    --text:#F9FAFB; --text-dim:#9CA3AF; --text-mute:#6B7280;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.5; }
  body { padding:24px; max-width:1440px; margin:0 auto; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .header-left h1 { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .header-left .sub { color:var(--text-dim); font-size:13px; margin-top:4px; }
  .partial-badge { display:inline-flex; align-items:center; gap:6px; background:#F9731620; color:var(--c-visitas); padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600; margin-left:12px; }
  .btn-export { background:var(--c-leads); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:0.15s; }
  .btn-export:hover { background:#2563EB; }

  /* Tabs */
  .tabs { display:flex; gap:0; border-bottom:1px solid var(--border-strong); margin-bottom:28px; }
  .tab { padding:12px 20px; cursor:pointer; color:var(--text-dim); font-weight:500; font-size:13.5px; border-bottom:2px solid transparent; transition:0.15s; }
  .tab.active { color:var(--text); border-bottom-color:var(--c-leads); }
  .tab:hover { color:var(--text); }

  /* Panels */
  .panel { display:none; }
  .panel.active { display:block; }

  /* Card */
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:20px; }
  .card-title { font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:16px; text-transform:uppercase; letter-spacing:0.06em; }

  /* YTD banner */
  .ytd-banner { background:linear-gradient(135deg,#111827 0%,#1F2937 100%); border:1px solid var(--border-strong); border-radius:14px; padding:24px 28px; display:grid; grid-template-columns:auto 1fr; gap:28px; align-items:center; margin-bottom:24px; }
  .ytd-label { border-right:1px solid var(--border-strong); padding-right:28px; }
  .ytd-label .big { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
  .ytd-label .period { font-size:22px; font-weight:700; margin-top:4px; letter-spacing:-0.01em; }
  .ytd-metrics { display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
  .ytd-metric .lbl { font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; margin-bottom:6px; }
  .ytd-metric .val { font-size:22px; font-weight:700; letter-spacing:-0.01em; }

  /* KPI row */
  .kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:24px; }
  .kpi { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid; border-radius:10px; padding:16px 16px 14px; }
  .kpi .lbl { font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-bottom:6px; }
  .kpi .val { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .kpi .sub { font-size:11px; color:var(--text-mute); margin-top:4px; }
  .delta { display:inline-block; margin-top:6px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .delta.up { background:#10B98120; color:var(--c-success); }
  .delta.dn { background:#EF444420; color:var(--c-alert); }

  /* Grid 2:1 */
  .grid-2-1 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }

  /* Funnel */
  .funnel { display:flex; flex-direction:column; gap:10px; }
  .funnel-step { display:grid; grid-template-columns:120px 1fr 110px; align-items:center; gap:12px; }
  .funnel-step .lbl { font-size:12.5px; color:var(--text-dim); font-weight:600; }
  .funnel-bar-wrap { height:36px; background:var(--bg-elev); border-radius:6px; overflow:hidden; }
  .funnel-bar { height:100%; display:flex; align-items:center; padding-left:12px; color:#fff; font-weight:700; font-size:13px; border-radius:6px; min-width:5%; }
  .funnel-pct { text-align:right; font-size:12.5px; color:var(--text-dim); }
  .funnel-pct .main { color:var(--text); font-weight:600; }
  .conv-stack { display:flex; flex-direction:column; gap:3px; }
  .conv-badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; display:inline-block; }
  .conv-lv { background:#10B98120; color:var(--c-vendas); }
  .conv-qv { background:#14B8A620; color:var(--c-conv-qv); }

  /* Insights */
  .insights { display:flex; flex-direction:column; gap:10px; }
  .insight { background:var(--bg-card); border-left:3px solid; border-radius:0 8px 8px 0; padding:10px 14px; font-size:12.5px; line-height:1.4; }

  /* Chart container */
  .chart-wrap { position:relative; height:300px; margin-top:8px; }
  .chart-wrap.sm { height:240px; }
  .chart-wrap.lg { height:360px; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:10px; font-size:12px; color:var(--text-dim); }
  .legend-item { display:flex; align-items:center; gap:6px; }
  .legend-dot { width:10px; height:10px; border-radius:3px; }

  /* Tables */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { color:#E5E7EB; background:#0F1521; padding:10px 8px; text-align:left; font-weight:600; border-bottom:2px solid var(--border-strong); font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; }
  th.r, td.r { text-align:right; }
  td { padding:9px 8px; border-bottom:1px solid var(--border); }
  tr.partial td { color:#D1D5DB; font-style:italic; }
  tr.total { background:#0F1521; border-top:2px solid var(--border-strong); font-weight:700; color:var(--text); }
  tr.total td { padding:12px 8px; }
  tr.best { background:linear-gradient(90deg,#10B98115 0%,transparent 100%); font-weight:600; }
  .star { color:var(--c-receita); margin-right:4px; }

  /* Month pills */
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .pill { padding:6px 14px; background:var(--bg-elev); border:1px solid var(--border-strong); border-radius:999px; font-size:12px; cursor:pointer; color:var(--text-dim); transition:0.15s; }
  .pill.active { background:var(--c-leads); color:#fff; border-color:var(--c-leads); }
  .pill:hover:not(.active) { background:var(--bg-hover); color:var(--text); }

  /* Vendors ranking */
  .vendor-list { display:flex; flex-direction:column; gap:8px; }
  .vendor-row { display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:10px; padding:10px 14px; background:var(--bg-elev); border-radius:8px; }
  .vendor-rank { font-size:16px; }
  .vendor-name { font-weight:600; }
  .vendor-stats { font-size:12px; color:var(--text-dim); text-align:right; }
  .vendor-stats .big { color:var(--c-vendas); font-weight:600; font-size:14px; }

  /* Visit cards */
  .visits { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
  .visit-card { background:var(--bg-elev); padding:12px 14px; border-radius:8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .visit-name { font-size:12.5px; }
  .badge { font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .badge-ok { background:#10B98120; color:var(--c-success); }
  .badge-pending { background:#F9731620; color:var(--c-visitas); }

  /* KPI header for visits */
  .kpi-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }

  /* Spark */
  .spark { display:inline-block; vertical-align:middle; margin-left:6px; }

  /* Donut legend */
  .origin-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .origin-row:last-child { border-bottom:0; }
  .origin-color { width:12px; height:12px; border-radius:3px; }
  .origin-name { flex:1; font-weight:500; }
  .origin-val { color:var(--text-dim); font-size:12px; }

  @media(max-width:900px){
    .kpi-grid, .ytd-metrics { grid-template-columns:repeat(2,1fr); }
    .grid-2-1, .grid-2 { grid-template-columns:1fr; }
  }
</style>

// Helpers
const fmt   = v => new Intl.NumberFormat('pt-BR').format(Math.round(v||0));
const fmtR$ = v => 'R$ ' + new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
const fmtPct= v => (isFinite(v)? (v*100).toFixed(1).replace('.',',') + '%' : '—');
const pct   = (a,b) => (b>0 ? a/b : 0);
const delta = (cur, prev) => {
  if (prev === null || prev === undefined || prev === 0 || !isFinite(prev)) return {val:null, dir:'eq'};
  const d = (cur - prev) / prev;
  if (!isFinite(d)) return {val:null, dir:'eq'};
  return { val:d, dir: d > 0.005 ? 'up' : d < -0.005 ? 'dn' : 'eq' };
};
const dBadge = d => {
  if (d.val === null || !isFinite(d.val)) return '';
  if (d.dir === 'eq') return '';
  const pctN = Math.abs(d.val * 100);
  const s = pctN.toFixed(1).replace('.', ',');
  const sign = d.val > 0 ? '↑' : '↓';
  return `<div class="delta ${d.dir}">${sign} ${s}%</div>`;
};

  const qualRate = pct(YTD.qualif, YTD.leads);
  const visRate  = pct(YTD.visitas, YTD.qualif);
  const bestMonth = MONTHS.reduce((a,b)=> b.receita > a.receita ? b : a);
  let insights = [];
  if (last.partial) insights.push({c:C.visitas, t:`● ${last.label} em andamento — ${last.dias_uteis} dias úteis, dados parciais`});
  if (qualRate > 0.1) insights.push({c:C.success, t:`✓ Qualificação saudável — ${fmtPct(qualRate)} dos leads qualificados no YTD`});
  else if (qualRate < 0.05) insights.push({c:C.alert, t:`⚠ Qualificação baixa — ${fmtPct(qualRate)} dos leads qualificados`});
  if (convLV < 0.02) insights.push({c:C.alert, t:`⚠ Conv L→V baixa (${fmtPct(convLV)}) — gargalo no funil`});
  if (convQV > 0.25) insights.push({c:C.success, t:`✓ Time comercial fechando bem — ${fmtPct(convQV)} dos qualificados viram venda`});
  else if (convQV > 0 && convQV < 0.1) insights.push({c:C.alert, t:`⚠ Conv Q→V baixa (${fmtPct(convQV)}) — revisar abordagem`});
  if (prev && last.receita > prev.receita * 1.3) insights.push({c:C.success, t:`↑ Receita de ${last.label} ${fmtPct((last.receita-prev.receita)/prev.receita)} acima de ${prev.label}`});
  if (prev && last.receita < prev.receita * 0.5 && !last.partial) insights.push({c:C.alert, t:`↓ Receita de ${last.label} caiu ${fmtPct((prev.receita-last.receita)/prev.receita)} vs ${prev.label}`});
  const lastTicket = last.vendas>0 ? last.receita/last.vendas : 0;
  const prevTicket = prev && prev.vendas>0 ? prev.receita/prev.vendas : 0;
  if (prevTicket>0 && lastTicket > prevTicket*1.1) insights.push({c:C.receita, t:`$ Ticket médio de ${last.label} (${fmtR$(lastTicket)}) subiu vs ${prev.label} (${fmtR$(prevTicket)})`});
  if (YTD.visitas > 0) insights.push({c:C.visitas, t:`○ ${fmtPct(visRate)} dos qualificados foram visitados (${fmt(YTD.visitas)}/${fmt(YTD.qualif)})`});
  insights.push({c:C.receita, t:`★ Melhor mês YTD: ${bestMonth.label} — ${fmtR$(bestMonth.receita)} em ${fmt(bestMonth.vendas)} vendas`});

  let insightsHTML = `<div class="card"><div class="card-title">Insights automáticos</div><div class="insights">`;
  insights.forEach(ins => {
    insightsHTML += `<div class="insight" style="border-left-color:${ins.c}">${ins.t}</div>`;
  });
  insightsHTML += `</div></div>`;

  // Monthly table
  let tbl = `<div class="card"><div class="card-title">Resumo Mensal</div>
    <table><thead><tr>
      <th>Mês</th><th class="r">Leads</th><th class="r">Qualif</th><th class="r">% Qualif</th>
      <th class="r">Orç</th><th class="r">Visitas</th><th class="r">Vendas</th>
      <th class="r">L→V</th><th class="r">Q→V</th><th class="r">Receita</th>
    </tr></thead><tbody>`;
  MONTHS.forEach(m => {
    const qr = pct(m.qualificados, m.total_leads);
    const lv = pct(m.vendas, m.total_leads);
    const qv = pct(m.vendas, m.qualificados);
    tbl += `<tr class="${m.partial?'partial':''}">
      <td><strong>${m.label}</strong>${m.partial?' <span style="color:'+C.visitas+'">●</span>':''}</td>
      <td class="r">${fmt(m.total_leads)}</td>
      <td class="r">${fmt(m.qualificados)}</td>
      <td class="r">${fmtPct(qr)}</td>
      <td class="r">${fmt(m.orcamentos)}</td>
      <td class="r">${fmt(m.visitas_total)}</td>
      <td class="r">${fmt(m.vendas)}</td>
      <td class="r" style="color:${C.vendas}">${fmtPct(lv)}</td>
      <td class="r" style="color:${C.convQV}">${fmtPct(qv)}</td>
      <td class="r">${fmtR$(m.receita)}</td>
    </tr>`;
  });
  const ytdLV = pct(YTD.vendas,YTD.leads), ytdQV = pct(YTD.vendas,YTD.qualif), ytdQR = pct(YTD.qualif,YTD.leads);
  tbl += `<tr class="total">
    <td>TOTAL YTD</td>
    <td class="r">${fmt(YTD.leads)}</td>
    <td class="r">${fmt(YTD.qualif)}</td>
    <td class="r">${fmtPct(ytdQR)}</td>
    <td class="r">${fmt(YTD.orc)}</td>
    <td class="r">${fmt(YTD.visitas)}</td>
    <td class="r">${fmt(YTD.vendas)}</td>
    <td class="r" style="color:${C.vendas}">${fmtPct(ytdLV)}</td>
    <td class="r" style="color:${C.convQV}">${fmtPct(ytdQV)}</td>
    <td class="r">${fmtR$(YTD.receita)}</td>
  </tr></tbody></table></div>`;

  p.innerHTML = banner + kpis + `<div class="grid-2-1"><div>${funnel}</div><div>${insightsHTML}</div></div>` +
    `<div class="grid-2">
      <div class="card">
        <div class="card-title">Receita Mensal</div>
        <div class="legend"><div class="legend-item"><div class="legend-dot" style="background:${C.receita}"></div>Receita</div></div>
        <div class="chart-wrap"><canvas id="chart-receita-mensal"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Leads · Visitas · Vendas por mês</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:${C.leads}"></div>Leads</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.visitas}"></div>Visitas</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.vendas}"></div>Vendas</div>
        </div>
        <div class="chart-wrap"><canvas id="chart-triplo"></canvas></div>
      </div>
    </div>` + tbl;

  // Charts
  const labels = MONTHS.map(m => m.label.slice(0,3));
  const bgReceita = MONTHS.map(m => m.partial ? C.receita+'80' : C.receita);
  new Chart(document.getElementById('chart-receita-mensal'), {
    type:'bar',
    data:{ labels, datasets:[{ data: MONTHS.map(m=>m.receita), backgroundColor: bgReceita, borderRadius:6, borderSkipped:false }] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ ticks:{ callback:(v)=>'R$ '+(v/1000).toFixed(0)+'K' }, grid:{ color:'#1F293780' } }, x:{ grid:{display:false} } },
      plugins:{ tooltip:{ callbacks:{ label:(c)=> fmtR$(c.raw) } } }
    }
  });
  new Chart(document.getElementById('chart-triplo'), {
    data:{ labels, datasets:[
      { type:'bar', label:'Leads', data: MONTHS.map(m=>m.total_leads), backgroundColor:MONTHS.map(m=> m.partial? C.leads+'80' : C.leads), borderRadius:6, borderSkipped:false, yAxisID:'yL' },
      { type:'line', label:'Visitas', data: MONTHS.map(m=>m.visitas_total), borderColor:C.visitas, backgroundColor:C.visitas, tension:0.3, borderWidth:2, pointRadius:4, yAxisID:'yV' },
      { type:'line', label:'Vendas', data: MONTHS.map(m=>m.vendas), borderColor:C.vendas, backgroundColor:C.vendas, tension:0.3, borderWidth:2, pointRadius:4, yAxisID:'yV' },
    ] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{
        yL:{ position:'left', beginAtZero:true, ticks:{ color:C.leads }, grid:{ color:'#1F293780' } },
        yV:{ position:'right', beginAtZero:true, ticks:{ color:C.vendas }, grid:{ display:false } },
        x:{ grid:{display:false} }
      }
    }
  });
}

// ============== SEMANAL ==============
function renderSemanal() {
  const p = document.getElementById('panel-semanal');
  const monthsWithWeeks = MONTHS.filter(m => m.weeks && m.weeks.length);
  let pillsHTML = `<div class="pills">`;
  monthsWithWeeks.forEach((m,i) => {
    pillsHTML += `<div class="pill ${i===monthsWithWeeks.length-1?'active':''}" data-month="${m.name}">${m.label}</div>`;
  });
  pillsHTML += `</div>`;

  p.innerHTML = pillsHTML +
    `<div class="grid-2">
      <div class="card">
        <div class="card-title">Leads × Vendas por semana</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:${C.leads}"></div>Leads</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.vendas}"></div>Vendas</div>
        </div>
        <div class="chart-wrap"><canvas id="chart-sem-barras"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Receita por semana</div>
        <div class="legend"><div class="legend-item"><div class="legend-dot" style="background:${C.receita}"></div>Receita</div></div>
        <div class="chart-wrap"><canvas id="chart-sem-receita"></canvas></div>
      </div>
    </div>` +
    `<div class="card"><div class="card-title">Semanas em detalhe</div><div id="semanal-table"></div></div>`;

  let currentMonth = monthsWithWeeks[monthsWithWeeks.length-1];
  let chartB=null, chartR=null;

  function render(m) {
    const labels = m.weeks.map(w=>w.label);
    const leads  = m.weeks.map(w=>w.leads);
    const vendas = m.weeks.map(w=>w.vendas);
    const receita= m.weeks.map(w=>w.receita);
    const bestIdx = receita.reduce((bi,v,i)=> v>receita[bi]?i:bi, 0);

    if (chartB) chartB.destroy();
    if (chartR) chartR.destroy();
    chartB = new Chart(document.getElementById('chart-sem-barras'), {
      type:'bar',
      data:{ labels, datasets:[
        { label:'Leads', data:leads, backgroundColor:C.leads, borderRadius:6, borderSkipped:false, yAxisID:'yL' },
        { label:'Vendas', data:vendas, backgroundColor:C.vendas, borderRadius:6, borderSkipped:false, yAxisID:'yV' },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{
          yL:{ position:'left', beginAtZero:true, ticks:{ color:C.leads }, grid:{ color:'#1F293780' } },
          yV:{ position:'right', beginAtZero:true, ticks:{ color:C.vendas }, grid:{ display:false } },
          x:{ grid:{display:false} }
        }
      }
    });
    chartR = new Chart(document.getElementById('chart-sem-receita'), {
      type:'line',
      data:{ labels, datasets:[{ label:'Receita', data: receita, borderColor:C.receita, backgroundColor:C.receita+'20', fill:true, tension:0.3, borderWidth:2, pointRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ y:{ ticks:{ callback:(v)=> 'R$ '+(v/1000).toFixed(1)+'K' }, grid:{ color:'#1F293780' } }, x:{ grid:{display:false} } },
        plugins:{ tooltip:{ callbacks:{ label:(c)=> fmtR$(c.raw) } } }
      }
    });

    let tbl = `<table><thead><tr>
      <th>Semana</th><th class="r">Dias</th><th class="r">Leads</th>
      <th class="r">Qualif</th><th class="r">% Qualif</th>
      <th class="r">Vendas</th><th class="r">Conv L→V</th><th class="r">Conv Q→V</th>
      <th class="r">Receita</th><th class="r">Ticket</th>
    </tr></thead><tbody>`;
    m.weeks.forEach((w,i) => {
      const qr = pct(w.qualif,w.leads), lv = pct(w.vendas,w.leads), qv = pct(w.vendas,w.qualif);
      const ticket = w.vendas>0 ? w.receita/w.vendas : 0;
      tbl += `<tr class="${i===bestIdx?'best':''}">
        <td>${i===bestIdx?'<span class="star">★</span>':''}${w.label}</td>
        <td class="r">${fmt(w.dias)}</td>
        <td class="r">${fmt(w.leads)}</td>
        <td class="r">${fmt(w.qualif)}</td>
        <td class="r">${fmtPct(qr)}</td>
        <td class="r">${fmt(w.vendas)}</td>
        <td class="r" style="color:${C.vendas}">${fmtPct(lv)}</td>
        <td class="r" style="color:${C.convQV}">${fmtPct(qv)}</td>
        <td class="r">${fmtR$(w.receita)}</td>
        <td class="r">${ticket>0?fmtR$(ticket):'—'}</td>
      </tr>`;
    });
    tbl += `</tbody></table>`;
    document.getElementById('semanal-table').innerHTML = tbl;
  }

  render(currentMonth);
  p.querySelectorAll('.pill').forEach(pl => {
    pl.addEventListener('click', () => {
      p.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      pl.classList.add('active');
      currentMonth = monthsWithWeeks.find(m => m.name === pl.dataset.month);
      render(currentMonth);
    });
  });
}

// ============== ORIGENS ==============
function renderOrigens() {
  const p = document.getElementById('panel-origens');
  let pillsHTML = `<div class="pills"><div class="pill active" data-mode="ytd">YTD</div>`;
  MONTHS.forEach(m => pillsHTML += `<div class="pill" data-mode="${m.name}">${m.label}</div>`);
  pillsHTML += `</div>`;

  p.innerHTML = pillsHTML +
    `<div class="grid-2">
      <div class="card">
        <div class="card-title">Volume por canal</div>
        <div class="chart-wrap"><canvas id="chart-origens-bar"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Participação</div>
        <div class="chart-wrap sm"><canvas id="chart-origens-donut"></canvas></div>
        <div id="origens-legend" style="margin-top:14px"></div>
      </div>
    </div>` +
    `<div class="card">
      <div class="card-title">Ranking de Vendedores · YTD</div>
      <div id="vendors-rank"></div>
    </div>`;

  // Vendor ranking from sales lists
  const vendorAgg = {};
  MONTHS.forEach(m => m.vendas_list.forEach(s => {
    if (!s.vendedor || s.vendedor==='N/D') return;
    if (!vendorAgg[s.vendedor]) vendorAgg[s.vendedor] = {vendas:0, receita:0};
    vendorAgg[s.vendedor].vendas += 1;
    vendorAgg[s.vendedor].receita += s.valor;
  }));
  const vendors = Object.entries(vendorAgg).map(([n,v])=>({name:n,...v})).sort((a,b)=> b.receita-a.receita);
  const medals = ['🥇','🥈','🥉'];
  let vhtml = `<div class="vendor-list">`;
  vendors.forEach((v,i) => {
    vhtml += `<div class="vendor-row">
      <div class="vendor-rank">${medals[i]||('#'+(i+1))}</div>
      <div class="vendor-name">${v.name}</div>
      <div class="vendor-stats">
        <div><span class="big">${fmt(v.vendas)}</span> vendas · ticket médio ${fmtR$(v.receita/v.vendas)}</div>
        <div>${fmtR$(v.receita)}</div>
      </div>
    </div>`;
  });
  vhtml += `</div>`;
  document.getElementById('vendors-rank').innerHTML = vhtml;

  let bar=null, donut=null;
  function render(mode) {
    let origens;
    if (mode==='ytd') {
      origens = {Email:0, Krolic:0, RD:0, Outbound:0};
      MONTHS.forEach(m => Object.keys(origens).forEach(k => origens[k] += (m.origens[k]||0)));
    } else {
      const m = MONTHS.find(x=>x.name===mode);
      origens = {...m.origens};
    }
    const labels = Object.keys(origens);
    const values = labels.map(k => origens[k]);
    const colors = labels.map((_,i) => CAT[i%CAT.length]);
    const total = values.reduce((a,b)=>a+b,0);

    if (bar) bar.destroy();
    if (donut) donut.destroy();
    bar = new Chart(document.getElementById('chart-origens-bar'), {
      type:'bar',
      data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderRadius:6, borderSkipped:false }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        scales:{ x:{ grid:{color:'#1F293780'} }, y:{ grid:{display:false} } }
      }
    });
    donut = new Chart(document.getElementById('chart-origens-donut'), {
      type:'doughnut',
      data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:2, borderColor:'#111827' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'65%' }
    });
    let lg = '';
    labels.forEach((lb,i) => {
      const p = total>0 ? values[i]/total : 0;
      lg += `<div class="origin-row">
        <div class="origin-color" style="background:${colors[i]}"></div>
        <div class="origin-name">${lb}</div>
        <div class="origin-val">${fmt(values[i])} · ${fmtPct(p)}</div>
      </div>`;
    });
    document.getElementById('origens-legend').innerHTML = lg;
  }
  render('ytd');
  p.querySelectorAll('.pill').forEach(pl => {
    pl.addEventListener('click', () => {
      p.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      pl.classList.add('active');
      render(pl.dataset.mode);
    });
  });
}

// ============== VISITAS ==============
function renderVisitas() {
  const p = document.getElementById('panel-visitas');
  let pillsHTML = `<div class="pills"><div class="pill active" data-mode="ytd">YTD</div>`;
  MONTHS.forEach(m => pillsHTML += `<div class="pill" data-mode="${m.name}">${m.label}</div>`);
  pillsHTML += `</div>`;

  p.innerHTML = pillsHTML + `<div id="visitas-body"></div>`;

  function render(mode) {
    let totalV, qualif, vendas, list;
    if (mode==='ytd') {
      totalV = YTD.visitas; qualif = YTD.qualif; vendas = YTD.vendas;
      list = [];
      MONTHS.forEach(m => m.visitas_list.forEach(v => list.push({...v, mes:m.label})));
    } else {
      const m = MONTHS.find(x=>x.name===mode);
      totalV = m.visitas_total; qualif = m.qualificados; vendas = m.vendas;
      list = m.visitas_list.map(v => ({...v, mes:m.label}));
    }
    const visQual = pct(totalV, qualif);
    const visVend = pct(vendas, totalV);
    let html = `<div class="kpi-3">
      <div class="kpi" style="border-left-color:${C.visitas}">
        <div class="lbl">Total de Visitas</div>
        <div class="val" style="color:${C.visitas}">${fmt(totalV)}</div>
        <div class="sub">${mode==='ytd'?'Acumulado 2026':'Mês de referência'}</div>
      </div>
      <div class="kpi" style="border-left-color:${C.qualif}">
        <div class="lbl">% dos Qualificados</div>
        <div class="val" style="color:${C.qualif}">${fmtPct(visQual)}</div>
        <div class="sub">${fmt(totalV)} de ${fmt(qualif)} qualificados</div>
      </div>
      <div class="kpi" style="border-left-color:${C.vendas}">
        <div class="lbl">Conv Visita → Venda</div>
        <div class="val" style="color:${C.vendas}">${fmtPct(visVend)}</div>
        <div class="sub">${fmt(vendas)} vendas / ${fmt(totalV)} visitas</div>
      </div>
    </div>`;

    html += `<div class="card"><div class="card-title">Visitas registradas (${fmt(list.length)})</div>`;
    if (list.length === 0) {
      html += `<div style="color:var(--text-dim); padding:20px; text-align:center">Nenhuma visita registrada neste período.</div>`;
    } else {
      html += `<div class="visits">`;
      list.forEach(v => {
        const st = (v.status||'').toLowerCase();
        const badgeCls = (st.includes('ok') || st === '') ? 'badge-ok' : 'badge-pending';
        const badgeTxt = st.includes('pend') ? 'Pendente' : (st.includes('higi') ? 'Higiclear' : 'OK');
        html += `<div class="visit-card">
          <div class="visit-name"><strong style="color:${C.visitas}">${v.mes}</strong> · ${v.name}</div>
          <div class="badge ${badgeCls}">${badgeTxt}</div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    document.getElementById('visitas-body').innerHTML = html;
  }

  render('ytd');
  p.querySelectorAll('.pill').forEach(pl => {
    pl.addEventListener('click', () => {
      p.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      pl.classList.add('active');
      render(pl.dataset.mode);
    });
  });
}

// ============== VENDAS FECHADAS ==============
function renderVendas() {
  const p = document.getElementById('panel-vendas');

        <div class="lbl">Receita</div>
        <div class="val" style="color:${C.receita}">${fmtR$(totalReceita)}</div>
        <div class="sub">${label}</div>
      </div>
      <div class="kpi" style="border-left-color:${C.ticket}">

        <div class="val" style="color:${C.ticket}">${totalVendas>0?fmtR$(ticket):'—'}</div>
        <div class="sub">${label}</div>

      html += `<div style="color:var(--text-dim); padding:20px; text-align:center">Nenhuma venda registrada neste período.</div>`;
    } else {
      html += `<table><thead><tr>
        <th>Mês</th><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Origem</th><th class="r">Valor</th>

      list.sort((a,b)=> b.valor - a.valor);
      list.forEach(v => {
        html += `<tr>
          <td><strong style="color:${C.vendas}">${v.mes}</strong></td>
          <td>${v.data||'—'}</td>
          <td>${v.cliente||'—'}</td>
          <td>${v.vendedor||'—'}</td>
          <td>${v.origem||'—'}</td>
          <td class="r">${fmtR$(v.valor)}</td>
        </tr>`;
      });
      html += `<tr class="total"><td colspan="5">TOTAL · ${label}</td><td class="r">${fmtR$(totalReceita)}</td></tr>`;
      html += `</tbody></table>`;
    }
    html += `</div>`;
    document.getElementById('vendas-body').innerHTML = html;
  }

  render('ytd');
  p.querySelectorAll('.pill').forEach(pl => {
    pl.addEventListener('click', () => {
      p.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      pl.classList.add('active');
      render(pl.dataset.mode);
    });
  });
}
