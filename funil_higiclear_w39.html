function delta(cur,prev){
  if(!prev||prev===0) return null;
  const v = (cur-prev)/prev;
  if(Math.abs(v)<0.005) return null;
  const abs = (Math.abs(v)*100).toFixed(1).replace('.',',');
  return {v, txt: (v>0?'+':'-')+abs+'%'};
}
function deltaBadge(cur,prev){
  const d = delta(cur,prev);
  if(!d) return '';
  return `<span class="delta ${d.v>0?'up':'dn'}">${d.txt}</span>`;
}

      <td>${pct(YTD.qual/YTD.leads)}</td><td>${fmt(YTD.orcs)}</td><td>${fmt(YTD.vendas)}</td>
      <td class="c-lv">${pct(YTD.vendas/YTD.leads)}</td><td class="c-qv">${pct(YTD.vendas/YTD.qual)}</td>
      <td>${fmtBR(YTD.receita)}</td></tr>
    </tbody></table></div></div>`;

  el.innerHTML = html;

  // Charts
  new Chart(document.getElementById('ch-receita'),{
    type:'bar',
    data:{labels:MONTHS.map(m=>m.abbr),datasets:[{label:'Receita',data:MONTHS.map(m=>m.receita),backgroundColor:C.receita,borderRadius:6}]},
    options:baseOpts({y:{ticks:{callback:v=>fmtBR(v)}}})
  });
  new Chart(document.getElementById('ch-lv'),{
    data:{labels:MONTHS.map(m=>m.abbr),datasets:[
      {type:'bar',label:'Leads',data:MONTHS.map(m=>m.leads),backgroundColor:C.leads,yAxisID:'y',borderRadius:6},
      {type:'line',label:'Vendas',data:MONTHS.map(m=>m.vendas),borderColor:C.vendas,backgroundColor:C.vendas,yAxisID:'y1',tension:.3,pointRadius:4}
    ]},
    options:baseOpts({y:{position:'left',title:{display:true,text:'Leads',color:'#9CA3AF'}},y1:{position:'right',grid:{display:false},title:{display:true,text:'Vendas',color:'#9CA3AF'}}})
  });
}

function funnelHTML(){
  const total = YTD.leads;
  const steps = [
    {lbl:'Leads',val:YTD.leads,color:C.leads},
    {lbl:'Qualificados',val:YTD.qual,color:C.qual},
    {lbl:'Orçamentos',val:YTD.orcs,color:C.orcs},
    {lbl:'Vendas',val:YTD.vendas,color:C.vendas},
  ];
  return `<div class="funnel-viz">${steps.map((s,i)=>{
    const w = Math.max(15, (s.val/total)*100);
    const extra = i===steps.length-1 ? `<div style="margin-left:12px;font-size:12px;color:var(--muted)">L→V <span class="c-lv"><strong>${pct(YTD.vendas/YTD.leads)}</strong></span> · Q→V <span class="c-qv"><strong>${pct(YTD.vendas/YTD.qual)}</strong></span></div>` : '';
    return `<div class="funnel-step"><div class="funnel-lbl">${s.lbl}</div><div class="funnel-bar" style="width:${w}%;background:${s.color}">${fmt(s.val)}</div>${extra}</div>`;
  }).join('')}</div>`;
}

function insightsHTML(){
  const closed = MONTHS.filter(m=>!m.partial);
  const bestMonth = [...closed].sort((a,b)=>b.receita-a.receita)[0];
  const worstQ = [...closed].sort((a,b)=>(a.qual/a.leads)-(b.qual/b.leads))[0];
  const bestLV = [...closed].sort((a,b)=>(b.vendas/b.leads)-(a.vendas/a.leads))[0];
  const bestQV = [...closed].sort((a,b)=>(b.vendas/b.qual)-(a.vendas/a.qual))[0];
  const ticket = YTD.vendas ? YTD.receita/YTD.vendas : 0;
  const qtx = YTD.qual/YTD.leads;
  const lvtx = YTD.vendas/YTD.leads;
  const qvtx = YTD.vendas/YTD.qual;
  const growth = closed.length>=2 ? ((closed[closed.length-1].receita/closed[0].receita)-1) : 0;
  return `<ul class="insights" style="padding-left:18px;color:var(--muted2)">
    <li><strong class="c-qual">Qualificação:</strong> ${pct(qtx)} dos leads (piora em ${worstQ?.label}).</li>
    <li><strong class="c-lv">Conv L→V YTD:</strong> ${pct(lvtx)} · melhor em <strong>${bestLV?.label}</strong> (${pct(bestLV?.vendas/bestLV?.leads)}).</li>
    <li><strong class="c-qv">Conv Q→V YTD:</strong> ${pct(qvtx)} · melhor em <strong>${bestQV?.label}</strong> (${pct(bestQV?.vendas/bestQV?.qual)}).</li>
    <li><strong class="c-receita">Crescimento receita:</strong> ${(growth*100).toFixed(1).replace('.',',')}% do 1º ao último mês fechado.</li>
    <li><strong class="c-ticket">Ticket médio YTD:</strong> ${fmtBR(ticket)}.</li>
    <li><strong class="c-receita">Melhor mês:</strong> <strong>${bestMonth?.label}</strong> · ${fmtBR(bestMonth?.receita)}.</li>
  </ul>`;
}

function baseOpts(scales){
  return {
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#F9FAFB'}}},
    scales:Object.assign({x:{ticks:{color:'#9CA3AF'},grid:{color:'#1F2937'}},y:{ticks:{color:'#9CA3AF'},grid:{color:'#1F2937'}}}, scales||{})
  };
}

// ==== SEMANAL ====
let semSelected = 0;
function renderSemanal(){
  const el = document.getElementById('semanal');
  const pills = MONTHS.map((m,i)=>`<div class="pill ${i===semSelected?'active':''}" onclick="semSelected=${i};renderSemanal()">${m.abbr}${m.partial?' *':''}</div>`).join('');
  const m = MONTHS[semSelected];
  const weeks = m.weeks;
  const bestIdx = weeks.reduce((b,w,i,a)=>w.receita>a[b].receita?i:b,0);

  let html = `<div class="pills">${pills}</div>
  <div class="grid g2" style="margin-bottom:20px">
    <div class="card"><h2>Leads vs Vendas · ${m.label}</h2><div class="chart-box"><canvas id="ch-sem1"></canvas></div></div>
    <div class="card"><h2>Receita por semana · ${m.label}</h2><div class="chart-box"><canvas id="ch-sem2"></canvas></div></div>
  </div>
  <div class="card"><h2>Detalhe semanal · ${m.label}${m.partial?' <span class="partial">parcial</span>':''}</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>Semana</th><th>Dias</th><th>Leads</th><th>Qualif</th><th>% Qualif</th><th>Vendas</th><th>L→V</th><th>Q→V</th><th>Receita</th><th>Ticket</th></tr></thead>
    <tbody>${weeks.map((w,i)=>`
      <tr class="${i===bestIdx?'best':''}"><td>${i===bestIdx?'<span class="medal">★</span>':''}${w.name}</td>
      <td>${w.dias||'—'}</td><td>${fmt(w.leads)}</td><td>${fmt(w.qual)}</td>
      <td>${pct(w.leads?w.qual/w.leads:0)}</td><td>${fmt(w.vendas)}</td>
      <td class="c-lv">${pct(w.leads?w.vendas/w.leads:0)}</td>
      <td class="c-qv">${pct(w.qual?w.vendas/w.qual:0)}</td>
      <td>${fmtBR(w.receita)}</td>
      <td>${w.vendas?fmtBR(w.receita/w.vendas):'—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  el.innerHTML = html;

  new Chart(document.getElementById('ch-sem1'),{
    data:{labels:weeks.map(w=>w.name),datasets:[
      {type:'bar',label:'Leads',data:weeks.map(w=>w.leads),backgroundColor:C.leads,yAxisID:'y',borderRadius:6},
      {type:'line',label:'Vendas',data:weeks.map(w=>w.vendas),borderColor:C.vendas,backgroundColor:C.vendas,yAxisID:'y1',tension:.3,pointRadius:4}
    ]},
    options:baseOpts({y:{position:'left'},y1:{position:'right',grid:{display:false}}})
  });
  new Chart(document.getElementById('ch-sem2'),{
    type:'line',
    data:{labels:weeks.map(w=>w.name),datasets:[{label:'Receita',data:weeks.map(w=>w.receita),borderColor:C.receita,backgroundColor:'rgba(245,158,11,.15)',tension:.3,fill:true,pointRadius:4}]},
    options:baseOpts({y:{ticks:{callback:v=>fmtBR(v)}}})
  });
}

// ==== ORIGENS ====
let origSelected = MONTHS.length-1;
function renderOrigens(){
  const el = document.getElementById('origens');
  const pills = MONTHS.map((m,i)=>`<div class="pill ${i===origSelected?'active':''}" onclick="origSelected=${i};renderOrigens()">${m.abbr}${m.partial?' *':''}</div>`).join('');
  const m = MONTHS[origSelected];
  const canais = Object.entries(m.canais);

  // vendedores no mês
  const vendors = {};
  m.sales.forEach(s => {
    if(!vendors[s.vendedor]) vendors[s.vendedor] = {count:0,receita:0};
    vendors[s.vendedor].count++;
    vendors[s.vendedor].receita += s.valor;
  });
  const vendArr = Object.entries(vendors).sort((a,b)=>b[1].receita-a[1].receita);
  const medals = ['🥇','🥈','🥉'];

  let html = `<div class="pills">${pills}</div>
  <div class="grid g2" style="margin-bottom:20px">
    <div class="card"><h2>Leads por canal · ${m.label}</h2><div class="chart-box"><canvas id="ch-ori1"></canvas></div></div>
    <div class="card"><h2>Participação · ${m.label}</h2><div class="chart-box"><canvas id="ch-ori2"></canvas></div></div>
  </div>
  <div class="card"><h2>Ranking de vendedores · ${m.label}</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>#</th><th>Vendedor</th><th>Vendas</th><th>Receita</th><th>Ticket médio</th></tr></thead>
    <tbody>${vendArr.map(([v,d],i)=>`<tr><td>${medals[i]||i+1}</td><td><strong>${v}</strong></td><td>${d.count}</td><td>${fmtBR(d.receita)}</td><td>${fmtBR(d.receita/d.count)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  el.innerHTML = html;

  new Chart(document.getElementById('ch-ori1'),{
    type:'bar',
    data:{labels:canais.map(c=>c[0]),datasets:[{label:'Leads',data:canais.map(c=>c[1]),backgroundColor:CAT,borderRadius:6}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9CA3AF'},grid:{color:'#1F2937'}},y:{ticks:{color:'#9CA3AF'},grid:{display:false}}}}
  });
  new Chart(document.getElementById('ch-ori2'),{
    type:'doughnut',
    data:{labels:canais.map(c=>c[0]),datasets:[{data:canais.map(c=>c[1]),backgroundColor:CAT,borderColor:'#111827',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#F9FAFB'}}}}
  });
}

// ==== VENDAS FECHADAS ====
let venSelected = MONTHS.length-1;
function renderVendas(){
  const el = document.getElementById('vendas');
  const pills = MONTHS.map((m,i)=>`<div class="pill ${i===venSelected?'active':''}" onclick="venSelected=${i};renderVendas()">${m.abbr}${m.partial?' *':''}</div>`).join('');
  const m = MONTHS[venSelected];
  const sales = m.sales;
  const totalReceita = sales.reduce((a,s)=>a+s.valor,0);
  const ticket = sales.length ? totalReceita/sales.length : 0;

  const origColors = {'Site de Busca':'#3B82F6','General Clean':'#10B981','RD Station':'#F59E0B','Indicações':'#8B5CF6','Hygibras':'#EC4899','Captação':'#06B6D4','Outbound':'#F97316','Outros':'#6B7280'};

  let html = `<div class="pills">${pills}</div>
  <div class="grid g3" style="margin-bottom:20px">
    <div class="kpi"><div class="lbl">Total de vendas</div><div class="val c-vendas">${fmt(sales.length)}</div></div>
    <div class="kpi"><div class="lbl">Receita fechada</div><div class="val c-receita">${fmtBR(totalReceita)}</div></div>
    <div class="kpi"><div class="lbl">Ticket médio</div><div class="val c-ticket">${fmtBR(ticket)}</div></div>
  </div>
  <div class="card"><h2>Vendas · ${m.label}</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Origem</th><th>Valor</th></tr></thead>
    <tbody>${sales.map(s=>`<tr>
      <td>${s.data||'—'}</td>
      <td>${s.cliente}</td>
      <td>${s.vendedor}</td>
      <td><span class="badge" style="background:${(origColors[s.origem]||'#6B7280')}22;color:${origColors[s.origem]||'#9CA3AF'}">${s.origem}</span></td>
      <td>${fmtBR2(s.valor)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
  el.innerHTML = html;
}

// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const p = t.dataset.panel;
  document.getElementById(p).classList.add('active');
  if(p==='semanal') renderSemanal();
  if(p==='origens') renderOrigens();
  if(p==='vendas') renderVendas();
}));
